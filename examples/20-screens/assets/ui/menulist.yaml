# A twelve-entry list in a view that shows six of them, for -scroll.
#
# The rows are progress bars rather than panels because a progress bar's fill
# is the cheapest visible "this one is focused" this schema has: the game binds
# the focused row's value to its max and every other row's to zero, so the
# highlight is a filled row and everything else is the row's own background.
# Both halves are flat quads, so the whole list is one mesh and one draw.
#
# The label inside each row is an ordinary child, which is the part worth
# watching: text lines are clipped by trimming their glyph quads, so a row
# sliding under the top edge loses the top of its letters rather than the whole
# line at once.
widget: panel
id: root
width: 260
height: 240
padding: 10
gap: 8
bg_color: [0.07, 0.08, 0.10]
children:
  - widget: label
    id: title
    height: 20
    text: "INVENTORY — up/down"
    font_size: 14
    color: [0.78, 0.65, 0.31]

  - widget: scroll_view
    id: menu
    height: 192
    gap: 4
    scrollbar: always
    children:
      - widget: progress_bar
        id: row0
        height: 30
        value: "{v0}"
        max: "100"
        bg_color: [0.12, 0.13, 0.16]
        fg_color: [0.20, 0.42, 0.30]
        children:
          - widget: label
            text: "  01  iron ingot"
            font_size: 15
            color: [0.88, 0.89, 0.92]
      - widget: progress_bar
        id: row1
        height: 30
