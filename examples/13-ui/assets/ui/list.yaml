# A scrollable list, a nested pair of views and a horizontal strip.
#
# Watch it with:  go run ./13-ui -yamlui list
# Wheel over the list, drag it with the left button, or drag its thumb. The
# strip at the bottom takes the wheel too, because it is the only axis it has.
#
# Every number here is also a number in `task scroll`, which reads pixels out
# of boxes derived from this file at scale 1, pinned at yamlHUDOrigin
# (420, 190). Change a height, a padding or a gap and those boxes move:
#
#   root    420,190 400x404, padding 12, gap 16  -> inner x 432, width 376
#   above   432,202 376x24     a dark band the list must never draw over
#   list    432,242 376x160    six 40px rows: 240 of content, 80 of travel
#   below   432,418 376x24     the other band
#   outer   432,458 376x80     holds a 30px spacer and a taller inner view,
#   inner   432,488 376x80     so the inner clip is the intersection, 488..538
#   hband   432,554 376x28     four 150px columns: 600 of content, 224 of travel
#
# The row colours are deliberately far apart and far from the background, so a
# box that reads the wrong colour says which row leaked rather than only that
# something did.
widget: panel
id: root
width: 400
height: 404
padding: 12
gap: 16
bg_color: [0.85, 0.86, 0.88]
children:
  - widget: panel
    id: above
    height: 24
    bg_color: [0.10, 0.10, 0.12]

  - widget: scroll_view
    id: list
    height: 160
    scrollbar: auto
    children:
      - widget: panel
        id: row0
        height: 40
        bg_color: [0.90, 0.20, 0.20]
      - widget: panel
        id: row1
        height: 40
        bg_color: [0.20, 0.70, 0.30]
      - widget: panel
        id: row2
        height: 40
        bg_color: [0.20, 0.35, 0.90]
      - widget: panel
        id: row3
        height: 40
        bg_color: [0.90, 0.75, 0.15]
      - widget: panel
        id: row4
        height: 40
        bg_color: [0.70, 0.25, 0.80]
      - widget: panel
        id: row5
        height: 40
        bg_color: [0.15, 0.75, 0.75]

  - widget: panel
    id: below
    height: 24
    bg_color: [0.10, 0.10, 0.12]

  # The nested pair. The inner view is 80 tall inside an 80-tall outer that
  # already spent 30 of it on the spacer, so the inner's own clip and the
  # outer's disagree by 30 pixels and the intersection is the only right
  # answer.
  - widget: scroll_view
    id: outer
    height: 80
    children:
      - widget: panel
        id: nestpad
        height: 30
        bg_color: [0.55, 0.55, 0.58]
      - widget: scroll_view
        id: inner
        height: 80
        scrollbar: never
        children:
          - widget: panel
            id: deep0
            height: 40
            bg_color: [0.95, 0.30, 0.55]
          - widget: panel
            id: deep1
            height: 40
            bg_color: [0.30, 0.95, 0.55]

  # Sideways, so the side edges are clipped by something and the wheel has
  # nowhere else to go.
  - widget: scroll_view
    id: hband
    height: 28
    layout: horizontal
    scroll_direction: horizontal
    children:
      - widget: panel
        id: col0
        width: 150
        bg_color: [0.95, 0.85, 0.20]
      - widget: panel
        id: col1
        width: 150
        bg_color: [0.20, 0.85, 0.95]
      - widget: panel
        id: col2
        width: 150
        bg_color: [0.85, 0.20, 0.95]
      - widget: panel
        id: col3
        width: 150
        bg_color: [0.20, 0.95, 0.30]
