# The confirm dialog `task transition` measures and
# `go run ./13-ui -yamlui dialog` opens on the space bar.
#
# Everything here is on yamlui's flat quad path -- `bg_color` panels and one
# label -- because that is the path a transition's opacity has to reach through
# ShapeFn: renderer.Vertex has no alpha channel, so a fading quad cannot ride
# the shared vertex stream. A nine-slice dialog would have proved less.
#
# Two transitions, deliberately nested. The dialog fades, shrinks and slides on
# `in_out_quad`, whose value at half its duration is exactly 0.5 -- which is
# what makes the gate's midpoint a number rather than a curve lookup. The
# cancel bar inside it pops on `out_back`, overshooting past its own rect and
# settling back, and multiplies its opacity by the dialog's. The pop is there
# to be watched; a still frame cannot tell an overshoot from a slow arrival.
#
# The geometry is fixed on purpose. Every box in the Taskfile's invocation is
# derived from the numbers below at scale 1, pinned at yamlHUDOrigin
# (420, 190), so a change to a height, a padding or a gap here moves boxes that
# are written down over there:
#
#	root    420,190 400x270, padding 20, gap 20
#	spacer  440,210 360x40   (no bg_color: draws nothing)
#	dialog  440,270 360x170, padding 16, gap 10  -> anchor (620, 355)
#	title   456,286 328x28
#	accept  456,324 328x50
#	cancel  456,384 328x30
#
# At half of the dialog's transition the eased value is 0.5, so its scale
# factor is 0.85 + 0.5*0.15 = 0.925 and its slide is -20 of the -40 it starts
# at. The dialog's top edge is then at 355 - 85*0.925 - 20 = 256.4 against 270
# at rest, and the accept bar covers 306.3..352.6 against 324..374.
#
# dialog_plain.yaml must stay identical to this file apart from the two
# `transition:` blocks: the gate requires a frame past the end of the in to
# match it pixel for pixel, so any other difference fails it.
widget: panel
id: dialog_root
width: 400
height: 270
padding: 20
gap: 20
bg_color: [0.85, 0.86, 0.88]
children:
  - widget: panel
    id: dialog_spacer
    height: 40
  - widget: panel
    id: dialog
    height: 170
    padding: 16
    gap: 10
    bg_color: [0.05, 0.06, 0.08]
    visible: "{dialog_open}"
    transition:
      duration: 0.4
      ease: in_out_quad
      scale: 0.85
      offset_y: -40
    children:
      - widget: label
        id: dialog_title
        height: 28
        text: "Discard changes?"
        font_size: 18
        align: center
        color: [0.92, 0.93, 0.95]
      - widget: panel
        id: dialog_accept
        height: 50
        bg_color: [0.16, 0.42, 0.30]
      - widget: panel
        id: dialog_cancel
        height: 30
        bg_color: [0.42, 0.18, 0.18]
        visible: "{dialog_open}"
        transition:
          duration: 0.4
          ease: out_back
          scale: 0.7
