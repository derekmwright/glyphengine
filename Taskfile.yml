      - go run ./07-terrain -frames 150 -screenshot ../docs/images/07-terrain.png
      - go run ./08-grass -frames 150 -screenshot ../docs/images/08-grass.png
      - go run ./09-water -frames 150 -screenshot ../docs/images/09-water.png
