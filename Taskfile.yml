version: "3"

vars:
  EXE: '{{if eq OS "windows"}}.exe{{end}}'
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

env:
  CGO_ENABLED: "1"
  # Automated checks must not interrupt typing in another application.
  GLYPHENGINE_BACKGROUND: "1"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # ───────────────────────── examples ─────────────────────────

  examples:
    desc: List the runnable examples
    dir: examples
    cmds:
      - 'echo "Runnable examples (task example:<name>):"'
      - 'ls -d [0-9]*/ | sed "s#/##" | sed "s/^/  /"'
    silent: true

  "example:*":
    desc: "Run one example, e.g. task example:01-triangle"
    vars:
      NAME: '{{index .MATCH 0}}'
    dir: 'examples/{{.NAME}}'
    env:
      GLYPHENGINE_BACKGROUND: "0"
    cmds:
      - go run . {{.CLI_ARGS}}

  # ───────────────────────── shaders ─────────────────────────
  # .spv files are COMMITTED on purpose: shaders/shaders.go embeds them with
  # go:embed, so without them the module will not build for anyone who runs
  # `go get`. glslc is therefore only needed when editing GLSL.

  shaders:
    desc: Compile GLSL to SPIR-V (requires VULKAN_SDK; only needed when editing shaders)
    dir: shaders
    cmds:
      - for f in *.vert *.frag *.comp; do "${VULKAN_SDK}/bin/glslc{{.EXE}}" "$f" -o "$f.spv" || exit 1; done
      - for f in ../cmd/skyshadowcheck/*.frag; do "${VULKAN_SDK}/bin/glslc{{.EXE}}" "$f" -o "$f.spv"; done
      - for f in ../cmd/apppasscheck/*.vert ../cmd/apppasscheck/*.frag ../cmd/apppasscheck/*.comp; do "${VULKAN_SDK}/bin/glslc{{.EXE}}" "$f" -o "$f.spv"; done
      - for f in ../examples/*/*.vert ../examples/*/*.frag ../examples/*/*.comp; do [ -f "$f" ] || continue; "${VULKAN_SDK}/bin/glslc{{.EXE}}" "$f" -o "$f.spv" || exit 1; done
    sources:
      - examples/*/*.vert
      - examples/*/*.frag
      - examples/*/*.comp
      - examples/*/*.inc
      - cmd/apppasscheck/*.vert
      - cmd/apppasscheck/*.frag
      - cmd/apppasscheck/*.comp
      - shaders/*.vert
      - shaders/*.frag
      - shaders/*.comp
      - shaders/*.inc
      - cmd/skyshadowcheck/*.frag
      - cmd/skyshadowcheck/*.inc
    generates:
      - examples/*/*.spv
      - cmd/apppasscheck/*.spv
      - shaders/*.spv
      - cmd/skyshadowcheck/*.spv

  skyshadows:
    desc: "Custom sky and lit shaders share directional shadows, through resize and disabling"
    env:
      GLYPHENGINE_FIXED_FRAME_TIME: "16.667ms"
      GLYPHENGINE_VALIDATION: "1"
    cmds:
      - go run ./cmd/skyshadowcheck

  shaderparameters:
    desc: "Sky and lit shaders read the same application uniform snapshot, through resize"
    env:
      GLYPHENGINE_FIXED_FRAME_TIME: "16.667ms"
      GLYPHENGINE_VALIDATION: "1"
    cmds:
      - go run ./cmd/skyshadowcheck -parameters

  normals:
    desc: "Check rough materials respect supplied normals (needs a GPU)"
    env:
      GLYPHENGINE_FIXED_FRAME_TIME: "16.667ms"
      GLYPHENGINE_VALIDATION: "1"
    cmds:
      - go run ./cmd/normalcheck
      - go run ./cmd/normalcheck -rotated

  shadowcoverage:
    desc: "A distant off-camera caster reaches a receiver without losing nearby shadows"
    env:
      GLYPHENGINE_FIXED_FRAME_TIME: "16.667ms"
      GLYPHENGINE_VALIDATION: "1"
    cmds:
      - mkdir -p .shadowcoverage
      - go run -C examples ./23-shadow-coverage -frames 60 -screenshot ../.shadowcoverage/on.png
      - go run -C examples ./23-shadow-coverage -coverage=false -frames 60 -screenshot ../.shadowcoverage/off.png
      - go run -C examples ./23-shadow-coverage -caster=false -frames 60 -screenshot ../.shadowcoverage/control.png
      - go run ./cmd/shadowcheck -on .shadowcoverage/on.png -off .shadowcoverage/off.png -control .shadowcoverage/control.png

  shaders:verify:
    desc: Assert the committed .spv match their GLSL (needs VULKAN_SDK)
    cmds:
      # The check itself lives in a Go test so it runs under `task ci` and in
      # CI without depending on which shell or coreutils are present. This is
      # just a named entry point for it.
      - go test ./shaders/ -run TestCommittedSPIRVMatchesGLSL -count=1 -v

  # ───────────────────────── fonts ─────────────────────────

  font:
    desc: Regenerate the MSDF font atlas for example 10-text
    cmds:
      # cmd/msdfatlas is pure Go, so this needs no C++ toolchain and no
      # msdf-atlas-gen install -- that is the point of having it in-tree.
      # -range 8 rather than the default 4: the example renders down to 13px,
      # and a glyph needs at least ~2 screen pixels of distance field to
      # resolve its edge. See the note on Options.Range.
      - >-
        go run ./cmd/msdfatlas
        -builtin -range 8 -out examples/10-text/assets/fonts/goregular
      - >-
        go run ./cmd/msdfatlas
        -builtin -range 8 -out examples/15-kitchen-sink/assets/fonts/goregular
      - >-
        go run ./cmd/msdfatlas
        -builtin -range 8 -out examples/13-ui/assets/fonts/goregular
    sources:
      - msdf/*.go
      - cmd/msdfatlas/*.go
    generates:
      - examples/10-text/assets/fonts/goregular.png
      - examples/10-text/assets/fonts/goregular.json
      - examples/15-kitchen-sink/assets/fonts/goregular.png
      - examples/15-kitchen-sink/assets/fonts/goregular.json

  # ───────────────────────── quality ─────────────────────────

  build:
    desc: Build the engine and all examples
    cmds:
      - go build ./...
      - go build -C examples ./...

  test:
    desc: Run all tests
    cmds:
      - go test ./... -count=1

  test:race:
    desc: Run tests under the race detector (the parallel movement phase needs it)
    cmds:
      - go test -race ./... -count=1

  fmt:
    desc: Format all Go code
    cmds:
      - gofmt -w .

  lint:
    desc: Check formatting, then vet
    cmds:
      # -unsafeptr=false: window.go bridges a GLFW surface handle through
      # unsafe.Pointer on purpose, and the check has no way to know that.
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "Not gofmt'd:"
          echo "$unformatted"
          exit 1
        fi
      - go vet -unsafeptr=false ./...
      # -C must be the first flag on the command line.
      - go vet -C examples -unsafeptr=false ./...

  lod:
    desc: "Per-instance culling, LOD fades, impostors and deferred lifetime (needs a GPU)"
    cmds:
      # 25-lod-forest frames 60/61, tree rectangle 575,280..705,440:
      # MSAA4 MAE 0.069279/255 (fade 6) vs 3.698333/255 (fade 0).
      # Broken and rejected: no cull (3875 bucket entries, 0 culled), no fade
      # (both 3.698333), no billboard draw (far MAE 0), wall-clock camera
      # (different PNGs), no set release (resource count grows), and equal
      # benchmark GPU totals (3.992 >= 3.992). Allocation reuse is separately
      # broken in the recorder fixture: four allocations instead of zero.
      - go run ./cmd/lodcheck {{.CLI_ARGS}}

  smoke:
    desc: "Headless-ish smoke test: render a fixed number of frames of every example and exit"
    dir: examples
    cmds:
      # check-example.sh keeps both startup attempts; only a pre-frame
      # vkCreateSwapchainKHR failure is retried once (issue #125).
      # Break verified 2026-09-24 on 01-triangle with validation: injecting
      # VkResult=-13 at startup once logged STARTUP FAILURE (swapchain), then
      # rendered 2 frames on attempt 2 (exit 0). Persistent injection made
      # exactly 2 attempts and Task exited 201. Injection was removed.
      # Disabling the helper's retry makes check:self-test fail (1 call vs 2).
      - |
        status=0
        CHECK_DIR=../.task/smoke
        CHECK_FRAMES=60
        CHECK_VALIDATE=0
        . ../tools/check-example.sh
        # A non-zero exit after a possible startup retry fails the gate. Frame
        # counts are small on purpose -- this checks that pipelines build and
        # frames present, not that the image looks right.
        check 01-triangle
        check 02-cube
        check 03-physics
        check 04-first-person
        check 05-textures
        check 06-skinned
        check 08-grass
        check 07-terrain
        # A real Blender terrain converted by cmd/heightmapconv (issue #70),
        # not the procedural fBm terrain the run above uses -- the -heightmap
        # path is untested by every other run here. 65x65 grid, ~17 KB, small
        # enough to commit alongside the .glb it was converted from; see
        # examples/07-terrain/assets/README.md.
        check 07-terrain -heightmap 07-terrain/assets/blender_terrain.heightmap
        check 09-water
        check 11-lights
        check 12-particles
        check 13-ui
        # The UI glow layer, which no stock run allocates: a second colour
        # target, a second bloom chain, two more pipelines and a composite that
        # replaces the direct draw. None of it is reached without the flag.
        check 13-ui -glow on
        check 10-text
        check 16-materials
        check 17-input
        check 18-translucent
        check 19-instanced
        check 25-lod-forest
        check 20-screens
        check 21-streetlights
        check 22-level
        check 23-shadow-coverage
        check 24-custom-passes
        check 15-kitchen-sink -demo
        exit $status

  validate:
    desc: "Run every example under the Vulkan validation layer; fails on leaked objects"
    dir: examples
    env:
      GLYPHENGINE_VALIDATION: "1"
    cmds:
      # Requires a GPU and the Vulkan SDK, so this is deliberately not part of
      # `task ci`.
      #
      # Every example is expected to run completely silent under the layer, so
      # this fails on ANY validation message -- not just leaks. That is a
      # strict gate on purpose: Vulkan misuse is usually invisible until it
      # corrupts a frame on hardware you do not own, and the only cheap signal
      # is "the layer said something". Leaked objects are reported separately
      # because they surface at vkDestroyDevice rather than during rendering.
      - |
        status=0
        CHECK_DIR=../.task/validate
        CHECK_FRAMES=30
        CHECK_VALIDATE=1
        . ../tools/check-example.sh
        for ex in 01-triangle 02-cube 03-physics 04-first-person 05-textures 06-skinned 07-terrain 08-grass 09-water 10-text 11-lights 12-particles 13-ui 16-materials 17-input 18-translucent 19-instanced 20-screens 21-streetlights 22-level 15-kitchen-sink; do
          check $ex
        done
        check 24-custom-passes
        check 24-custom-passes -passes off
        check 25-lod-forest
        check 25-lod-forest -msaa 1
        check 25-lod-forest -replace
        check 25-lod-forest -gpu -replace
        check 25-lod-forest -gpu -indexed
        check 23-shadow-coverage
        check 23-shadow-coverage -coverage=false
        check 23-shadow-coverage -caster=false
        # Render paths no example turns on by default. Everything above runs
        # with stock settings, so an opt-in path can rot for months with every
        # gate green -- the layer only ever sees the code that actually runs.
        check 08-grass -grassimpostor 25
        # A second InitGrass call, replacing the first's atlas, instance
        # buffers and flora models while frames still in flight may be
        # drawing them (issue #87). No stock run above calls InitGrass more
        # than once, so replaceGrass's deferred release -- and the descriptor
        # set it gives back, which the pool has no other way to notice a leak
        # of before it runs dry -- is otherwise untested under the layer. The
        # run asserts its own live resource counts and exits non-zero if they
        # move; see docs/agents/grass.md.
        check 08-grass -regrow 20
        # The blended skinned pipeline. No default run reaches it: 06-skinned's
        # character carries a generated normal map, which routes it through the
        # skinned material pipeline instead.
        check 06-skinned -demo -plain -fade 0.4
        # A real Blender export, not the Go-written level.glb the stock
        # 22-level run above loads. Blender is the reference world-building
        # pipeline (issue #67) and its exporter takes paths -- KHR_texture_transform,
        # a mirrored node's negative-determinant matrix, several nodes sharing
        # one doc mesh from ordinary object duplication AND from a collection
        # instance -- that a hand-authored fixture never exercises. See
        # renderer/testdata/blender/README.md and docs/agents/blender-pipeline.md.
        check 22-level -level ../renderer/testdata/blender/level.glb
        # -instanced (issue #71): batches every doc mesh shared by several
        # static nodes into one renderer.InstanceSet instead of one entity
        # per node. No stock run above takes this path at all -- the whole
        # instancedGroupCandidate/spawnInstancedGroup/spawnInstancedCollider
        # machinery in examples/22-level/main.go, and the InstanceSet upload
        # it drives, is otherwise untested under the layer. Both level
        # files: the built-in one instances two doc meshes (four buildings,
        # four lamp posts), the Blender export instances one
        # (Building/Building_Linked) through a different sharing mechanism
        # (Alt-D rather than a hand-written duplicate) -- see
        # docs/agents/instancing.md.
        check 22-level -instanced
        check 22-level -instanced -level ../renderer/testdata/blender/level.glb
        # Renderer.DestroyModel, which no stock run reaches: 22-level swaps the
        # level for a freshly loaded copy twenty times over, releasing each old
        # model while frames that drew it are still in flight. That is the case
        # DestroyMesh's and DestroyTexture's immediacy would make a
        # use-after-free, and the layer is the only thing that sees it. Both
        # level files, because only the Blender one carries a texture, and a
        # texture is the resource a model SHARES across its primitives -- the
        # one a naive release frees twice. The run asserts its own live
        # resource counts and exits non-zero if they move; see `task reload`
        # for the frame-by-frame half of the same check.
        check 22-level -reload 20
        check 22-level -reload 20 -level ../renderer/testdata/blender/level.glb
        # Renderer.DestroyInstanceSet (issue #84), which nothing above
        # reaches either: -instanced alone never releases a set, and
        # -reload alone never creates one. Swapping an INSTANCED level
        # exercises both DestroyModel and DestroyInstanceSet releasing
        # their resources in the same tick, with frames still in flight
        # referencing the old ones -- the harder case for InstanceSet for
        # the same reason it is for Model. Both level files, same reason as
        # the plain -reload runs above: only the Blender one carries a
        # texture, and only the built-in one instances two doc meshes
        # rather than one (see docs/agents/instancing.md).
        check 22-level -reload 20 -instanced
        check 22-level -reload 20 -instanced -level ../renderer/testdata/blender/level.glb
        # A heightmap converted from a real Blender terrain (issue #70),
        # not the procedurally-generated one the stock 07-terrain run above
        # uses -- CreateTerrainMesh/CreateIndexedMesh32 run against real
        # (if small) converted grid data here, not synthetic fBm.
        check 07-terrain -heightmap 07-terrain/assets/blender_terrain.heightmap
        # 21-streetlights' non-default paths: the moving sweep, the cleared
        # spotlight set, a lamp count well past the default, and the debug
        # heatmap. None of these run under stock settings above.
        check 21-streetlights -sweep
        check 21-streetlights -off
        check 21-streetlights -lamps 300
        check 21-streetlights -lightdebug heatmap
        # The night grade setter. Strength 0 takes atmNightShift's early-out
        # and a custom tint takes the other branch, so between them the two
        # cover both sides of it with a uniform the layer can object to.
        check 21-streetlights -nightshift 0
        check 21-streetlights -nighttint 1.30,0.86,0.72
        # Volumetric in-scattering, which nothing above turns on: every light
        # ships with Volumetric 0, so all the runs before this take the march's
        # uniform early-out and never issue a load from the light buffers
        # inside it.
        #
        # -skylamp is the one that matters, and it is the reason this block
        # exists rather than one line. It is the only run in the whole gate
        # where sky.frag reads the three light storage buffers at set 1 --
        # bindings the sky pipeline had no access to at all until this change,
        # and which it reaches through a SECOND pipeline layout built for it.
        # A pipeline layout that disagreed with the set actually bound, or a
        # set layout the sky pipeline was not created against, is a validation
        # error at DRAW time and nothing else: the frame still presents, the
        # example still exits zero, and `task smoke` and `task determinism`
        # both stay green. That is the same trap documented in
        # docs/agents/overlay-composite.md, arriving by a different route.
        check 21-streetlights -volumetric 1 -skylamp
        check 21-streetlights -volumetric 1 -lampvolumetric 1 -lamps 300
        # Both debug paths through the march: brute force walks every uploaded
        # light at every step, the heatmap returns before applyFog is reached
        # at all.
        check 21-streetlights -volumetric 1 -lightdebug bruteforce
        check 21-streetlights -volumetric 1 -lightdebug heatmap
        # Volumetrics with the march turned off scene-wide but lights still
        # asking for it, and with a step count at the cap: the two ends of
        # packLitUBO's clamp, so a loop bound the shader cannot satisfy would
        # surface here.
        check 21-streetlights -volumetric 1 -volsteps 0
        check 21-streetlights -volumetric 1 -volsteps 64 -skylamp
        # And over water, where the march runs inside the WATER render pass on
        # a surface that shades itself. Same reasoning as the -lamps 9 runs
        # above: a second pass, a second pipeline, the same buffers.
        check 09-water -lamps 9 -spots 2 -time 0.02 -volumetric 1
        # Blended draws on both sides of the water surface. This is the one run
        # that records the translucent, particle and overlay pipelines inside
        # the WATER render pass, which no stock run reaches -- and render pass
        # compatibility is exactly the kind of thing only the layer sees. It
        # caught the first version of it on frame one, with a subpass
        # dependency mismatch the attachments gave no hint of. See
        # sceneEntryDependency.
        check 09-water -plume -ghost -marker -submerged
        # Lights over water. The water pipeline reads the three light storage
        # buffers at set 1 bindings 3-5 -- which it has been bound for since
        # clustered lighting landed, while the shader ignored them, so nothing
        # had ever actually issued a load from them inside the water pass.
        # -lampsoff is the same geometry with no lights at all, which is the
        # other side of that branch, and the two debug modes are the two paths
        # through resolveLightRange plus the heatmap's early return.
        check 09-water -lamps 9 -spots 2 -time 0.02
        check 09-water -lamps 9 -spots 2 -time 0.02 -lampsoff
        check 09-water -lamps 9 -spots 2 -time 0.02 -lightdebug heatmap
        check 09-water -lamps 9 -spots 2 -time 0.02 -lightdebug bruteforce
        # A non-default sky palette. The values reach the GPU through the same
        # uniform block either way, so the layer sees nothing new here -- but
        # this is the run in which sky.frag and clouds.frag read binding 1 of
        # the cloud descriptor set with something other than the engine's own
        # numbers in it, and a descriptor range that disagreed with the block
        # would surface here and nowhere else.
        check 09-water -alien -time 0.35
        check 09-water -alien -time 0.0
        check 09-water -cirrus 1 -time 0.755 -pitch -0.55
        check 09-water -cirrus 1 -clouds 0 -time 0 -pitch -0.55
        # The light shafts, which need the sun actually in frame -- and no
        # stock run of any example points at it, so every check above ran with
        # the shaft strength faded to zero and the pipeline unbound. The pass
        # binds the scene copy at set 0 and draws inside the WATER render pass
        # with a pipeline built against it, which is the same render-pass
        # compatibility trap that caught the blended draws above on frame one.
        # The second run adds the blended geometry, so the layer sees the shaft
        # draw and those in the same pass.
        check 09-water -time 0.72 -yaw 1.771 -pitch -0.185 -pillars
        check 09-water -time 0.72 -yaw 1.771 -pitch -0.185 -pillars -plume -ghost -marker -submerged
        # The UI glow layer, which no stock run allocates at all. Three things
        # live only on this path: its own render pass with the two overlay
        # pipelines built against it, its bloom chain, and the composite
        # blending onto the swapchain. The first of those is the trap that has
        # caught this renderer twice -- a pipeline is tied to the render pass it
        # was created against, and binding one inside a pass with a different
        # attachment format is a validation error at DRAW time rather than at
        # creation. The frame still presents and the example still exits zero.
        # See docs/agents/overlay-composite.md.
        check 13-ui -glow layer
        check 13-ui -glow on
        # The layer over water, with a 26-line HUD in the frame: the one run
        # where the UI layer and the water pass exist together, and the only one
        # where the layer's images are written in a frame that also copies the
        # scene for refraction.
        check 09-water -hud 26 -uiglow
        # And a swapchain rebuild with the layer on. recreateSwapchain destroys
        # the layer's images, its bloom chain, its framebuffers and the
        # resolve's descriptor sets and builds them all again; a set still
        # naming a freed image view is invisible in a release build and
        # reported only here. Rule 10, and the reason the teardown closure
        # reads r.uiLayer rather than capturing it.
        echo "-- the runs below rebuild the swapchain mid-flight --"
        export GLYPHENGINE_PROVOKE_RECREATE_FRAMES=15
        check 24-custom-passes
        check 13-ui -glow on
        check 13-ui
        check 25-lod-forest -replace
        check 25-lod-forest -gpu -replace
        check 25-lod-forest -gpu -indexed
        unset GLYPHENGINE_PROVOKE_RECREATE_FRAMES
        exit $status

  syncvalidate:
    desc: "Run the validation suite with synchronization hazard detection (needs GPU and SDK)"
    cmds:
      # Reuse the complete example/variant/rebuild matrix and its message-counter
      # self-check, so new validate cases also run under synchronization validation.
      # Explicit assignments also override inherited =0 settings. An internal
      # task: call evaluates the callee's environment independently, and Task's
      # env map alone does not override the caller's process environment.
      # Broken 2026-09-24: remove sceneEntryDependency's outgoing element
      # (keeping scene/water compatible). 01-triangle/30 fixed frames reports
      # 30 SYNC-HAZARD-READ-AFTER-WRITE messages; task exits 201 (shell 1).
      - GLYPHENGINE_VALIDATION=1 GLYPHENGINE_SYNC_VALIDATION=1 GLYPHENGINE_FIXED_FRAME_TIME=16.667ms task --silent validate
      - |
        probe=$(echo "VULKAN ERROR: self-check" | grep -cE "VULKAN (ERROR|WARNING)" || true)
        if [ "$probe" != "1" ]; then echo "SELF-CHECK: cannot count validation messages"; exit 1; fi
        out=$(GLYPHENGINE_VALIDATION=1 GLYPHENGINE_SYNC_VALIDATION=1 GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./cmd/apppasscheck -compute -buffers -churn -provoke-recreate -validate -frames 300 2>&1) || { echo "$out"; exit 1; }
        echo "$out" | grep -q "Vulkan synchronization validation enabled" || { echo "$out"; exit 1; }
        msgs=$(echo "$out" | grep -cE "VULKAN (ERROR|WARNING)" || true)
        if [ "$msgs" != "0" ]; then echo "$out"; exit 1; fi
        echo "apppasscheck -compute -buffers -churn -provoke-recreate: clean"

  reload:
    desc: "Check that swapping a level for a freshly loaded copy never drops a frame's geometry"
    dir: examples
    cmds:
      # Needs a GPU, so it sits with smoke, validate and determinism rather
      # than in `task ci`.
      #
      # `task validate` already runs the same -reload loop under the layer and
      # would catch a buffer freed while a frame still read it. This asks the
      # other question, which the layer cannot: did the picture stay whole?
      #
      # The first version of 22-level's -reload released the level and loaded
      # the replacement several frames later, and it passed validation in
      # silence while the whole world blinked out twenty times -- found by
      # someone watching the window, not by any gate. The loop swaps inside one
      # tick now, and this is what holds it there.
      #
      # Two fields, because they fail differently:
      #
      #   draws -count  the number of draws in the frame, over the WHOLE run.
      #                 A level that vanishes for a frame is a frame with fewer
      #                 draws in it, and nothing else in this repo would say so.
      #   draws         the ordered hash of the draw list, which also covers
      #                 every draw's model matrix and material constants -- so
      #                 the geometry is not merely present but in the same
      #                 place, including the anchor model the loop never
      #                 destroys. -skip 12 because the camera takes that many
      #                 frames to settle onto its authored pose and every
      #                 draw's MVP moves with it; the 20 swaps all happen after
      #                 frame 12.
      #
      # BROKEN, to check this is not decoration: stepReload changed back to
      # releasing the level on one cycle and loading the replacement on the
      # next, which is the shape that blinked. This FAILED, exit 201, with
      #
      #   tracefield: .reload/r.trace: draws changed at loop=4: 1, was 10 at loop=1
      #   22-level -reload 20 : the frame's draw COUNT moved -- the level went
      #       missing between a release and the next load
      #
      # -- draws=1 being the anchor alone, with the whole level gone. Worth
      # recording what did NOT fail first: releasing the old model before
      # loading the new one INSIDE the same tick passes this gate, correctly,
      # because no frame is drawn in between. Only frames actually drawn
      # without the level move the count.
      - |
        status=0
        d=.reload
        rm -rf $d && mkdir -p $d
        # Prove the assertion can fail before trusting it, the same rule
        # task determinism follows for its comparator. cam= is the camera,
        # which demonstrably moves over the first dozen frames of this very
        # trace, so -constant on it MUST report a difference. If it does not,
        # -constant is reporting everything as constant and the two real
        # checks below mean nothing.
        GLYPHENGINE_FIXED_FRAME_TIME=16.667ms GLYPHENGINE_STATE_TRACE=$d/self.trace go run ./22-level -reload 2 >/dev/null 2>&1
        if [ ! -s $d/self.trace ]; then echo "MISSING TRACE -- this gate proves nothing"; exit 1; fi
        if go run ../cmd/tracefield -key cam -constant -in $d/self.trace >/dev/null 2>&1; then
          echo "SELF-CHECK: -constant called a field that moves every frame constant -- this gate proves nothing"
          exit 1
        fi
        if go run ../cmd/tracefield -key notafield -constant -in $d/self.trace >/dev/null 2>&1; then
          echo "SELF-CHECK: tracefield accepted a field that is not there -- this gate proves nothing"
          exit 1
        fi
        run() {
          cycles=$1; shift
          label="22-level -reload $cycles $*"
          GLYPHENGINE_FIXED_FRAME_TIME=16.667ms GLYPHENGINE_STATE_TRACE=$d/r.trace go run ./22-level -reload $cycles "$@" >$d/r.log 2>&1 || {
            echo "$label: FAILED TO RUN"; tail -5 $d/r.log; status=1; return
          }
          if [ ! -s $d/r.trace ]; then echo "$label: MISSING TRACE -- this gate proves nothing"; status=1; return; fi
          if ! go run ../cmd/tracefield -key draws -count -constant -in $d/r.trace; then
            echo "$label: the frame's draw COUNT moved -- the level went missing between a release and the next load"
            status=1
          fi
          if ! go run ../cmd/tracefield -key draws -constant -skip 12 -in $d/r.trace; then
            echo "$label: the draw list changed across a swap -- reloaded geometry, or the model that was never destroyed, is not landing where it did"
            status=1
          fi
        }
        run 20
        run 20 -level ../renderer/testdata/blender/level.glb
        # -instanced (issue #84): the frame-by-frame half of the same check
        # for DestroyInstanceSet. `task validate` already runs this same
        # pair of commands under the layer; this asks the other question --
        # did the picture stay whole across a swap that gives InstanceSets
        # back, not only Models. The instanced level draws fewer draws than
        # the individual path above (four buildings collapse into one
        # InstanceSet, four lamp posts into another), which is fine: -count
        # -constant only requires the draw COUNT not to move across the
        # swaps, not to match the non-instanced run.
        run 20 -instanced
        run 20 -instanced -level ../renderer/testdata/blender/level.glb
        # And the same level 700 times, which is the run that would have
        # caught issue #82 and the reason this gate is not 20 cycles of
        # everything.
        #
        # 22-level's own per-cycle assertion is what does the catching here:
        # every cycle must start from the same ResourceCounts, and that now
        # includes the descriptor sets the level's texture holds. The failure
        # it was blind to before needed no assertion at all, only enough
        # cycles -- the pool simply ran out inside the next LOAD. On the tree
        # before the fix this run FAILED, exit 1, after 676 successful loads:
        #
        #   -reload: reloading the level: load level.glb: load gltf images:
        #   upload texture 0 (GroundTex): allocate descriptor set:
        #   vulkan error: out of pool memory
        #
        # 700 rather than 677 because the wall is not a fixed cycle number:
        # the pool fits MaxSets = 708 sets, the first two loads are the anchor
        # and the level Init already put up, and the renderer's own pass sets
        # come out of the same 708 and vary with the swapchain image count the
        # driver picks. 700 clears it on any of them with room to spare, and
        # this run is the only one here long enough for that to mean anything:
        # 2804 frames and 50 s on an RX 7900 XTX, where the same run at 20
        # cycles is 4 s.
        #
        # -level, not the built-in level: the built-in one carries no texture,
        # takes no descriptor set, and reloads indefinitely with the bug in
        # place. That is exactly why `task reload` did not see this for 20
        # cycles or for 700.
        run 700 -level ../renderer/testdata/blender/level.glb
        rm -rf $d
        exit $status

  sky:
    desc: "Check that celestial bodies are occluded by the terrain in front of them"
    dir: examples
    cmds:
      # Needs a GPU, so it sits with smoke, validate and determinism rather than
      # in `task ci`.
      #
      # The sun and moon draw after the sky, so clouds can cover them. What they
      # must still be is depth tested: geometry writes alpha 1.0, so the sky's
      # alpha cannot mask them against terrain and never could. Without the
      # depth test a sun that has set draws on top of the hills it set behind.
      #
      # This camera puts the setting sun squarely behind a headland. Nothing in
      # the lower two thirds should be brighter than the dark terrain there, and
      # the disc is pale yellow against nearly black, so the margin is enormous.
      #
      # -shafts 0 keeps this a test of the disc rather than of the disc plus a
      # radial blur. The shafts are drawn now (#50), so the flag has a job at
      # last -- though at this pose it would still change nothing: the sun is
      # behind the headland, the brightest pixel left in the frame is 0.46 in
      # linear, and godray.frag's window starts at 0.62, so the pass runs and
      # adds exactly zero. Verified: -shafts 3 renders a byte-identical frame.
      # Keep the flag anyway. Anything that raises this scene's brightest pixel
      # past the window -- a longer twilight, a brighter disc, an emissive
      # anything -- would turn a test of occlusion into a test of two effects.
      #
      # An earlier version of this comment said the shaft pass "samples the
      # scene and would react to the disc", and the sun-disc fix's commit
      # message blamed a 32 % frame difference on it. Both were wrong for the
      # same reason: nothing bound the pipeline.
      - |
        status=0
        d=.sky
        rm -rf $d && mkdir -p $d
        GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./09-water -frames 60           -time 0.77 -pitch 0.18 -yaw 2.4 -clouds 0 -stars 0 -band 0 -shafts 0           -screenshot $d/sun.png >/dev/null 2>&1
        if [ ! -s $d/sun.png ]; then
          echo "MISSING CAPTURE -- this gate proves nothing"
          exit 1
        fi
        go run ../cmd/skycheck -in $d/sun.png -y0 240 -max 120 || status=1
        rm -rf $d
        exit $status

  determinism:
    desc: "Check that a fixed frame clock makes renders, and the draw sequence behind them, identical"
    dir: examples
    cmds:
      # Needs a GPU, so it sits with smoke and validate rather than in `task ci`.
      #
      # The scenes here are the ones that move on their own: wind and clouds,
      # water, particle spawns, animation sampling. A still scene would pass
      # this without proving anything.
      # The output paths are relative on purpose: the examples resolve them
      # against their own working directory, and a Windows Go binary cannot
      # open the POSIX path mktemp hands back.
      - |
        status=0
        d=../.task/determinism
        rm -rf $d && mkdir -p $d
        shot() { GLYPHENGINE_FIXED_FRAME_TIME=$1 go run ./$2 -frames 90 $4 -screenshot $d/$3.png >/dev/null 2>&1; }
        same() {
          [ -s "$d/$1.png" ] && [ -s "$d/$2.png" ] || { echo "MISSING CAPTURE -- this gate proves nothing"; status=1; return 1; }
          diff -q "$d/$1.png" "$d/$2.png" >/dev/null 2>&1
        }
        # The same comparison over two named files rather than two captures,
        # for the draw-sequence gate below. Same rule: an empty file is a
        # missing measurement, not a match.
        samefile() {
          [ -s "$1" ] && [ -s "$2" ] || { echo "MISSING EXTRACT -- this gate proves nothing"; status=1; return 1; }
          diff -q "$1" "$2" >/dev/null 2>&1
        }
        # Prove the comparator before trusting a word it says.
        #
        # This used to hash with sha256sum, which is not on the PATH of the
        # shell task runs on Windows. Both hashes came back empty, every pair
        # compared equal, and the gate printed a column of "identical" that
        # meant nothing -- the failure only surfaced at the very end, on the
        # control. A comparator is a check like any other and gets checked
        # first. diff is what sh can be relied on to have; if it is missing too
        # it reports every pair as different, which fails loudly instead.
        printf a > $d/x.png; printf a > $d/y.png
        same x y || { echo "SELF-CHECK: two identical files compared unequal -- this gate proves nothing"; exit 1; }
        printf b > $d/y.png
        if same x y; then
          echo "SELF-CHECK: two different files compared equal -- this gate proves nothing"
          exit 1
        fi
        printf "loop=1 draws=1/aa" > $d/x.seq; printf "loop=1 draws=1/aa" > $d/y.seq
        samefile $d/x.seq $d/y.seq || { echo "SELF-CHECK: two identical extracts compared unequal -- this gate proves nothing"; exit 1; }
        printf "loop=1 draws=1/bb" > $d/y.seq
        if samefile $d/x.seq $d/y.seq; then
          echo "SELF-CHECK: two different extracts compared equal -- this gate proves nothing"
          exit 1
        fi
        # And the extractor: a trace with no draws= on any line must be an
        # error, not an empty file that compares equal to another empty file.
        # That is the exact shape the sha256sum failure had.
        if go run ../cmd/tracefield -key notafield -in $d/x.seq -out $d/z.seq >/dev/null 2>&1; then
          echo "SELF-CHECK: tracefield accepted a field that is not there -- this gate proves nothing"
          exit 1
        fi
        rm -f $d/x.png $d/y.png $d/x.seq $d/y.seq $d/z.seq
        # The water/blended split is in here because it reorders a buffer every
        # frame from the camera's position: a partition that was not stable, or
        # that read a stale upload, would show up as two runs disagreeing long
        # before anyone noticed it in a picture.
        #
        # 08-grass is rendered at night as well as at its default 0.28. Issue
        # #40 was a night capture, and the gate rendering only 0.28 is named in
        # the issue as the reason it went unseen: at night the sky is dim
        # enough that the grass silhouette is most of what the image is, so a
        # difference lands somewhere the daytime frame hides it.
        #
        # The last entry is the only one that draws light shafts -- no example
        # points at the sun with stock flags, so without it this gate covers
        # the effect not at all. It is not vacuous: the shafts move 68 % of that
        # frame's pixels and lift it by 6.8 mean sRGB luma, so the two captures
        # being equal is a statement about the effect rather than about its
        # absence. What it can catch is a per-pixel dither seeded from anything
        # that is not the pixel -- the shaft march is dithered, and noise of
        # that amplitude survives every other gate here, all of which read a
        # mean or a box.
        # The last entry is the only one with the UI glow layer in it. It moves
        # on its own twice over -- the camera orbits, the bars run on a sine,
        # and the warning's emission runs on another -- so a layer whose bloom
        # chain read a stale mip, or whose per-swapchain-image targets got out
        # of step with the image being presented, would show up as two runs
        # disagreeing. Without it this gate covers the feature not at all: no
        # other example allocates the layer.
        # The volumetric entry is the only one that marches in-scattering, and
        # the march is the one thing in the renderer whose per-pixel result
        # depends on a hash. volStartJitter has to be a function of
        # gl_FragCoord and of nothing else -- seed it from the frame, the
        # clock or anything that moves and every pixel of every beam changes
        # run to run, which no other entry here would notice because no other
        # entry turns the march on. -skylamp is in it because the sky's march
        # is a second copy of the jitter in a second shader.
        for ex in "08-grass" "08-grass -timeofday 0.0" "08-grass -timeofday 0.03" "09-water" "12-particles" "06-skinned -demo" "15-kitchen-sink -demo" "09-water -plume -ghost -marker -submerged" "09-water -time 0.72 -yaw 1.771 -pitch -0.185 -pillars" "13-ui -glow on" "21-streetlights -volumetric 1 -lampvolumetric 1 -skylamp" "24-custom-passes" "25-lod-forest" "25-lod-forest -gpu"; do
          set -- $ex
          name=$1; shift
          shot 16.667ms $name a "$*"
          shot 16.667ms $name b "$*"
          if same a b; then
            echo "$name $*: identical"
          elif [ $? -eq 1 ] && [ -s $d/a.png ]; then
            echo "$name $*: TWO RUNS DIFFER under a fixed clock"
            status=1
          fi
        done

        # Application graphics passes, including previous-frame history.
        # Run from the repository root so every harness scratch file stays in .task.
        for mode in "" "-history" "-compute" "-compute -history"; do
          frames=90
          case "$mode" in *compute*) frames=260;; esac
          (cd .. && GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./cmd/apppasscheck -frames $frames $mode -screenshot .task/app-determinism-a.png) >/dev/null 2>&1 || status=1
          (cd .. && GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./cmd/apppasscheck -frames $frames $mode -screenshot .task/app-determinism-b.png) >/dev/null 2>&1 || status=1
          if samefile ../.task/app-determinism-a.png ../.task/app-determinism-b.png; then
            echo "apppasscheck $mode: identical"
          else
            echo "apppasscheck $mode: TWO RUNS DIFFER or missing capture"
            status=1
          fi
        done

        # Two runs matching only says the machine behaved the same way twice.
        # What a fixed clock is supposed to buy is that the capture is a
        # function of the simulation and of nothing else -- and it was not: it
        # was also a function of how many frames the window system made the
        # renderer drop, and when. That arrives while a window is being shown,
        # when it moves between monitors, when the compositor changes mode, so
        # waiting for it is not a test. The GLYPHENGINE_PROVOKE_* variables put
        # one on a frame we name; see docs/agents/state-trace.md.
        #
        # Measured on this repo before the fixes, against the quiet capture of
        # the same build (1280x720, fixed clock):
        #
        #   rebuild after 08-grass frame 149     257601 px (27.95 %), max delta 104
        #   rebuild after 09-water frame 89      234723 px (25.47 %), max delta 114
        #   frame 149 of 08-grass never drawn     12986 px (1.41 %),  max delta 2
        #   frame 88 of 12-particles never drawn   9899 px (1.07 %),  max delta 2
        #   20 frames x 40ms of stall                 no change
        #   draw list reversed before the sort        no change
        #
        # The last two have never failed and are here as the other half of the
        # statement: a wall-clock stall must not reach the image, and neither
        # must the order an ECS query happens to walk its map in. The draw list
        # arrives in a different order on every frame of every run already --
        # the state trace shows draws= differing while drawsset= matches -- so
        # this is the check that keeps that latent.
        prov() {
          label=$1; var=$2; val=$3; name=$4; frames=$5; shift 5
          GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./$name -frames $frames $* -screenshot $d/q.png >/dev/null 2>&1
          # A subshell so the provocation cannot leak into the next pair; the
          # name is only known at runtime, so it is exported rather than
          # written as an assignment prefix.
          ( export "$var=$val"; GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./$name -frames $frames $* -screenshot $d/r.png >/dev/null 2>&1 )
          if same q r; then
            echo "$label: capture unchanged, as it must be"
          elif [ $? -eq 1 ] && [ -s $d/q.png ]; then
            echo "$label: THE CAPTURE CHANGED -- the picture depends on more than the simulation"
            status=1
          fi
        }
        prov "rebuild on the last frame"   GLYPHENGINE_PROVOKE_RECREATE_FRAMES 149        08-grass     150 -timeofday 0.28
        prov "rebuild mid-run"             GLYPHENGINE_PROVOKE_RECREATE_FRAMES 89         09-water      90
        # A moving camera, because every case above holds the camera still and
        # a still camera cannot tell a fresh reprojection matrix from a stale
        # one: prevVP equals the current VP on every frame. Leaving prevVP
        # unadvanced on the frame that triggers a rebuild passed all six other
        # cases and changes this capture at rebuild frames 60 and 89 alike.
        prov "rebuild under a moving camera" GLYPHENGINE_PROVOKE_RECREATE_FRAMES 60      15-kitchen-sink 90 -demo
        prov "a frame never drawn"         GLYPHENGINE_PROVOKE_SKIP_FRAMES     149        08-grass     150 -timeofday 0.0
        prov "frames never drawn"          GLYPHENGINE_PROVOKE_SKIP_FRAMES     3,40,88    12-particles  90
        prov "a stalled cold start"        GLYPHENGINE_PROVOKE_STALL           20:40ms    08-grass     150 -timeofday 0.0
        prov "draw list reversed"          GLYPHENGINE_PROVOKE_DRAW_ORDER      reverse    09-water      90 -plume -ghost -marker -submerged
        # Memory a shader can read before anything has written it, made
        # visible. The cloud history and the bloom chain are cleared once when
        # they are created and bound by a descriptor set every frame after
        # that; clearing them to BLACK hides any dependence on their contents,
        # because black is also what a fresh allocation usually holds. This
        # clears them to grey instead, so a read that should not be happening
        # reaches the picture. See GLYPHENGINE_PROVOKE_PRIME in
        # renderer/bloom.go and docs/agents/state-trace.md.
        #
        # It is here because of issue #40: a render that differs on the first
        # run of a session and on no later one is, on the face of it, the one
        # run whose allocations did not come back holding the previous run's
        # identical contents. That is now a variable rather than a wait, and
        # the answer on this repo is that the primed value reaches nothing --
        # not even frame 1, where it would be 80 % of the cloud layer if it
        # did.
        #
        # Verified by breaking it, which is why the three-frame entries are
        # here: seeding r.prevVP with the current VP on cloud frame 0 lets the
        # first frame reproject against a history nothing has rendered into,
        # and the primed grey becomes 80 % of that frame's cloud layer.
        # Measured against the quiet capture of the same broken build, as
        # differing channel samples out of 1280x720x4 = 3686400:
        #
        #   08-grass -timeofday 0.0, 1 frame     1324071 samples, max delta 164
        #   08-grass -timeofday 0.0, 3 frames    1323991 samples, max delta 133
        #   08-grass -timeofday 0.0, 150 frames      567 samples, max delta 1
        #   12-particles, 3 frames                732280 samples, max delta 130
        #   12-particles, 90 frames                    2 samples, max delta 1
        #
        # The long runs do catch it, by two samples and one level -- the
        # history decays by 0.8 a frame, so it is nearly gone by frame 90. The
        # short runs are what make this a check rather than a coin toss.
        prov "sampled images primed grey"  GLYPHENGINE_PROVOKE_PRIME           0.5        08-grass       3 -timeofday 0.0
        prov "sampled images primed grey"  GLYPHENGINE_PROVOKE_PRIME           0.5        08-grass     150 -timeofday 0.0
        prov "sampled images primed grey"  GLYPHENGINE_PROVOKE_PRIME           0.5        12-particles   3
        prov "sampled images primed grey"  GLYPHENGINE_PROVOKE_PRIME           0.5        12-particles  90
        # A rebuild with the UI glow layer on. The layer's images, bloom chain,
        # framebuffers and resolve sets are all destroyed and remade here, and
        # unlike the cloud history none of it is supposed to carry anything
        # across a frame -- so unlike the cloud history, this one has to come
        # back byte identical no matter when the rebuild lands.
        prov "rebuild with the UI glow layer" GLYPHENGINE_PROVOKE_RECREATE_FRAMES 60     13-ui         90 -glow on

        # The SEQUENCE the recorder was handed, not just the picture it made.
        #
        # Everything above compares captures, and a capture cannot see an
        # ordering bug that has not reached the image yet. This one did not:
        # the draw list arrives from a Go map walk, it was sorted with an
        # unstable sort, and the sort key's low bits were a descriptor set
        # ADDRESS -- so the recorded order was different in every process, and
        # `draws=` in the state trace differed between two runs of eight of the
        # thirteen scenes below while `drawsset=` and the PNG matched. Issue
        # #53. Nothing rendered wrong; the next scene with two equal-depth
        # blended draws would have flickered, and no capture gate would have
        # said why.
        #
        # So the assertion is on the trace field directly. cmd/tracefield pulls
        # `draws=` out and diff compares the two -- diff and not a hash, for the
        # reason written at the top of this gate. The whole trace cannot be
        # diffed: `slot=` and `image=` name the frame-in-flight and the
        # swapchain image the acquire returned, and both legitimately differ
        # between two runs that drew the same frame.
        #
        # Measured before the fix, two runs each, 90 frames (lines of 90 whose
        # draws= differed): 09-water 19, 12-particles 61, 06-skinned 90,
        # 09-water -plume... 33, 18-translucent 90, 13-ui 24, 10-text 13,
        # 21-streetlights 90. The three 08-grass poses, 15-kitchen-sink and
        # 19-instanced happened to match on that run, which is what "randomised"
        # means -- it is not a property of the scene.
        #
        # And verified by breaking the fix: with sortDraws' final tiebreak
        # replaced by `return 0`, this reports 18-translucent, 21-streetlights
        # and 12-particles as differing on all 90 lines and exits 1.
        #
        # Each case writes its own pair of traces, and a failure keeps them. It
        # used to reuse s1/s2 and the gate ended in an unconditional rm -rf, so
        # when "08-grass" differed on all 90 lines once -- and then matched on
        # twelve reruns, six on the branch under test and six on main -- there
        # was nothing left to say which kind of failure it had been. The two
        # kinds are told apart by `cam=`: the same camera handed different
        # draws is an ordering bug, which is what this case exists to catch,
        # while a camera that itself differs means something other than the
        # clock reached the scene. Window input is the obvious candidate --
        # the fixed clock does not suppress it, and 08-grass is a mouse-look
        # scene with the cursor locked -- but that is a suspect and not a
        # finding, which is the reason for keeping the evidence.
        #
        # Both reports verified by causing them, in one run: with sortDraws'
        # final tiebreak replaced by `return 0`, eight cases fail and every one
        # says the camera agrees; with 19-instanced's second run given `-width
        # 1000`, so that only its projection changed, that case says the camera
        # differs. The run exits 1 and leaves all thirteen pairs of traces.
        seq=0
        drawseq() {
          set -- $1
          name=$1; shift
          seq=$((seq+1))
          t1=$d/seq$seq.1.trace; t2=$d/seq$seq.2.trace
          GLYPHENGINE_FIXED_FRAME_TIME=16.667ms GLYPHENGINE_STATE_TRACE=$t1 go run ./$name -frames 90 $* >/dev/null 2>&1
          GLYPHENGINE_FIXED_FRAME_TIME=16.667ms GLYPHENGINE_STATE_TRACE=$t2 go run ./$name -frames 90 $* >/dev/null 2>&1
          go run ../cmd/tracefield -key draws -in $t1 -out $d/s1.draws || { status=1; return; }
          go run ../cmd/tracefield -key draws -in $t2 -out $d/s2.draws || { status=1; return; }
          if samefile $d/s1.draws $d/s2.draws; then
            echo "$name $*: draw sequence identical"
          else
            echo "$name $*: THE DRAW SEQUENCE DIFFERS between two runs"
            diff $d/s1.draws $d/s2.draws | head -6
            go run ../cmd/tracefield -key cam -in $t1 -out $d/s1.cam || { status=1; return; }
            go run ../cmd/tracefield -key cam -in $t2 -out $d/s2.cam || { status=1; return; }
            if samefile $d/s1.cam $d/s2.cam; then
              echo "  cam= agrees on every frame: one camera, two draw orders -- an ordering bug"
            else
              echo "  cam= differs too: the camera moved, so something other than the clock reached the scene"
              diff $d/s1.cam $d/s2.cam | head -4
            fi
            echo "  traces: examples/$t1 and examples/$t2"
            status=1
          fi
        }
        for ex in "08-grass" "08-grass -timeofday 0.0" "08-grass -timeofday 0.03" "09-water" "12-particles" "06-skinned -demo" "15-kitchen-sink -demo" "09-water -plume -ghost -marker -submerged" "18-translucent" "13-ui" "10-text" "19-instanced" "21-streetlights" "24-custom-passes" "25-lod-forest" "25-lod-forest -gpu"; do
          drawseq "$ex"
        done

        # What the grass was BUILT from, not the order it was drawn in.
        #
        # Everything above compares a frame's submissions. None of it can see a
        # scatter that put blades somewhere else while leaving the same number
        # in each tile -- grass= records the tile draw sequence, not the
        # instances -- and none of it can see an impostor atlas that baked
        # differently, though past GrassLOD.ImpostorDistance the atlas IS the
        # grass. Issue #40 is a night capture where 41 % of the pixels moved
        # with an identical simulation behind them, reported as a difference in
        # the blade silhouette, which is exactly the pair of things nothing here
        # was looking at.
        #
        # Verified by breaking it, both fields at once: folding the process's
        # own start time into GrassSystem.bakeHash and grassImpostor.atlasHash
        # makes both cases below report a difference on all 90 lines and the
        # gate exit 1.
        floraseq() {
          set -- $1
          name=$1; shift
          seq=$((seq+1))
          t1=$d/flora$seq.1.trace; t2=$d/flora$seq.2.trace
          GLYPHENGINE_FIXED_FRAME_TIME=16.667ms GLYPHENGINE_STATE_TRACE=$t1 go run ./$name -frames 90 $* >/dev/null 2>&1
          GLYPHENGINE_FIXED_FRAME_TIME=16.667ms GLYPHENGINE_STATE_TRACE=$t2 go run ./$name -frames 90 $* >/dev/null 2>&1
          for key in grassbake grassatlas; do
            go run ../cmd/tracefield -key $key -in $t1 -out $d/f1.$key || { status=1; continue; }
            go run ../cmd/tracefield -key $key -in $t2 -out $d/f2.$key || { status=1; continue; }
            if samefile $d/f1.$key $d/f2.$key; then
              echo "$name $*: $key identical"
            else
              echo "$name $*: $key DIFFERS between two runs"
              diff $d/f1.$key $d/f2.$key | head -4
              echo "  traces: examples/$t1 and examples/$t2"
              status=1
            fi
          done
        }
        for ex in "08-grass -timeofday 0.0" "08-grass -timeofday 0.28"; do
          floraseq "$ex"
        done
        # Prove this comparison can say no on real traces and not only on the
        # constructed files above. Without the fixed clock the model matrices
        # the hash covers are sampled at different times, so two runs of an
        # animated scene must disagree; if they do not, the traces are not
        # being read.
        GLYPHENGINE_STATE_TRACE=$d/c1.trace go run ./12-particles -frames 90 >/dev/null 2>&1
        GLYPHENGINE_STATE_TRACE=$d/c2.trace go run ./12-particles -frames 90 >/dev/null 2>&1
        go run ../cmd/tracefield -key draws -in $d/c1.trace -out $d/c1.draws || status=1
        go run ../cmd/tracefield -key draws -in $d/c2.trace -out $d/c2.draws || status=1
        if samefile $d/c1.draws $d/c2.draws; then
          echo "control: draw sequences matched WITHOUT a fixed clock -- this gate proves nothing"
          status=1
        else
          echo "control: the draw sequence differs without the fixed clock, as it must"
        fi
        # A paused world must be frozen, not merely slowed. 09-water is the
        # scene for it because the things that move there run off different
        # clocks: the waves and shoreline foam off the elapsed clock the shaders
        # read, the sun off Scene.Tick. Two captures taken 60 frames apart after
        # the pause are identical only if SetTimeScale stopped all of them.
        GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./09-water -frames 60 -pauseat 30 -screenshot $d/p1.png >/dev/null 2>&1
        GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./09-water -frames 120 -pauseat 30 -screenshot $d/p2.png >/dev/null 2>&1
        if same p1 p2; then
          echo "pause: world frozen, as it must be"
        else
          echo "pause: THE WORLD KEPT MOVING WHILE PAUSED"
          status=1
        fi

        # Prove the check is not vacuous: with the real clock the same two runs
        # must NOT match, or it is passing on a scene that never moves -- or on
        # captures that were never written.
        go run ./08-grass -frames 90 -screenshot $d/c.png >/dev/null 2>&1
        go run ./08-grass -frames 90 -screenshot $d/e.png >/dev/null 2>&1
        if same c e; then
          echo "control: 08-grass matched WITHOUT a fixed clock -- this gate proves nothing"
          status=1
        else
          echo "control: differs without the fixed clock, as it must"
        fi
        if [ $status -ne 0 ]; then
          echo "evidence kept in examples/$d"
        else
          rm -rf $d
        fi
        exit $status

