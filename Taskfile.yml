version: "3"

vars:
  EXE: '{{if eq OS "windows"}}.exe{{end}}'
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

env:
  CGO_ENABLED: "1"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # ───────────────────────── examples ─────────────────────────

  examples:
    desc: List the runnable examples
    dir: examples
    cmds:
      - 'echo "Runnable examples (task example:<name>):"'
      - 'ls -d [0-9]*/ | sed "s#/##" | sed "s/^/  /"'
    silent: true

  "example:*":
    desc: "Run one example, e.g. task example:01-triangle"
    vars:
      NAME: '{{index .MATCH 0}}'
    dir: 'examples/{{.NAME}}'
    cmds:
      - go run . {{.CLI_ARGS}}

  # ───────────────────────── shaders ─────────────────────────
  # .spv files are COMMITTED on purpose: shaders/shaders.go embeds them with
  # go:embed, so without them the module will not build for anyone who runs
  # `go get`. glslc is therefore only needed when editing GLSL.

  shaders:
    desc: Compile GLSL to SPIR-V (requires VULKAN_SDK; only needed when editing shaders)
    dir: shaders
    cmds:
      - for f in *.vert *.frag; do "${VULKAN_SDK}/bin/glslc{{.EXE}}" "$f" -o "$f.spv"; done
    sources:
      - shaders/*.vert
      - shaders/*.frag
      - shaders/*.inc
    generates:
      - shaders/*.spv

  shaders:verify:
    desc: Assert the committed .spv match their GLSL (needs VULKAN_SDK)
    cmds:
      # The check itself lives in a Go test so it runs under `task ci` and in
      # CI without depending on which shell or coreutils are present. This is
      # just a named entry point for it.
      - go test ./shaders/ -run TestCommittedSPIRVMatchesGLSL -count=1 -v

  # ───────────────────────── fonts ─────────────────────────

  font:
    desc: Regenerate the MSDF font atlas for example 10-text
    cmds:
      # cmd/msdfatlas is pure Go, so this needs no C++ toolchain and no
      # msdf-atlas-gen install -- that is the point of having it in-tree.
      # -range 8 rather than the default 4: the example renders down to 13px,
      # and a glyph needs at least ~2 screen pixels of distance field to
      # resolve its edge. See the note on Options.Range.
      - >-
        go run ./cmd/msdfatlas
        -builtin -range 8 -out examples/10-text/assets/fonts/goregular
      - >-
        go run ./cmd/msdfatlas
        -builtin -range 8 -out examples/15-kitchen-sink/assets/fonts/goregular
      - >-
        go run ./cmd/msdfatlas
        -builtin -range 8 -out examples/13-ui/assets/fonts/goregular
    sources:
      - msdf/*.go
      - cmd/msdfatlas/*.go
    generates:
      - examples/10-text/assets/fonts/goregular.png
      - examples/10-text/assets/fonts/goregular.json
      - examples/15-kitchen-sink/assets/fonts/goregular.png
      - examples/15-kitchen-sink/assets/fonts/goregular.json

  # ───────────────────────── quality ─────────────────────────

  build:
    desc: Build the engine and all examples
    cmds:
      - go build ./...
      - go build -C examples ./...

  test:
    desc: Run all tests
    cmds:
      - go test ./... -count=1

  test:race:
    desc: Run tests under the race detector (the parallel movement phase needs it)
    cmds:
      - go test -race ./... -count=1

  fmt:
    desc: Format all Go code
    cmds:
      - gofmt -w .

  lint:
    desc: Check formatting, then vet
    cmds:
      # -unsafeptr=false: window.go bridges a GLFW surface handle through
      # unsafe.Pointer on purpose, and the check has no way to know that.
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "Not gofmt'd:"
          echo "$unformatted"
          exit 1
        fi
      - go vet -unsafeptr=false ./...
      # -C must be the first flag on the command line.
      - go vet -C examples -unsafeptr=false ./...

  smoke:
    desc: "Headless-ish smoke test: render a fixed number of frames of every example and exit"
    dir: examples
    cmds:
      # A non-zero exit from any of these means the Vulkan path broke. Frame
      # counts are small on purpose -- this checks that pipelines build and
      # frames present, not that the image looks right.
      - go run ./01-triangle -frames 60
      - go run ./02-cube -frames 60
      - go run ./03-physics -frames 60
      - go run ./04-first-person -frames 60
      - go run ./05-textures -frames 60
      - go run ./06-skinned -frames 60
      - go run ./08-grass -frames 60
      - go run ./07-terrain -frames 60
      - go run ./09-water -frames 60
      - go run ./11-lights -frames 60
      - go run ./12-particles -frames 60
      - go run ./13-ui -frames 60
      - go run ./10-text -frames 60
      - go run ./16-materials -frames 60
      - go run ./17-input -frames 60
      - go run ./18-translucent -frames 60
      - go run ./19-instanced -frames 60
      - go run ./20-screens -frames 60
      - go run ./15-kitchen-sink -demo -frames 60

  validate:
    desc: "Run every example under the Vulkan validation layer; fails on leaked objects"
    dir: examples
    env:
      GLYPHENGINE_VALIDATION: "1"
    cmds:
      # Requires a GPU and the Vulkan SDK, so this is deliberately not part of
      # `task ci`.
      #
      # Every example is expected to run completely silent under the layer, so
      # this fails on ANY validation message -- not just leaks. That is a
      # strict gate on purpose: Vulkan misuse is usually invisible until it
      # corrupts a frame on hardware you do not own, and the only cheap signal
      # is "the layer said something". Leaked objects are reported separately
      # because they surface at vkDestroyDevice rather than during rendering.
      - |
        status=0
        check() {
          ex=$1; shift
          label=$ex
          if [ $# -gt 0 ]; then label="$ex $*"; fi
          out=$(go run ./$ex -frames 30 "$@" 2>&1) || { echo "$label: FAILED TO RUN"; echo "$out"; status=1; return; }
          msgs=$(echo "$out" | grep -cE "VULKAN (ERROR|WARNING)" || true)
          leaks=$(echo "$out" | grep -c "has not been destroyed" || true)
          if [ "$msgs" -ne 0 ]; then
            echo "$label: $msgs validation message(s), $leaks of them leaked objects"
            echo "$out" | grep -E "VULKAN (ERROR|WARNING)" | head -20
            status=1
          else
            echo "$label: clean"
          fi
        }
        for ex in 01-triangle 02-cube 03-physics 04-first-person 05-textures 06-skinned 07-terrain 08-grass 09-water 10-text 11-lights 12-particles 13-ui 16-materials 17-input 18-translucent 19-instanced 20-screens 15-kitchen-sink; do
          check $ex
        done
        # Render paths no example turns on by default. Everything above runs
        # with stock settings, so an opt-in path can rot for months with every
        # gate green -- the layer only ever sees the code that actually runs.
        check 08-grass -grassimpostor 25
        # The blended skinned pipeline. No default run reaches it: 06-skinned's
        # character carries a generated normal map, which routes it through the
        # skinned material pipeline instead.
        check 06-skinned -demo -plain -fade 0.4
        exit $status

  sky:
    desc: "Check that celestial bodies are occluded by the terrain in front of them"
    dir: examples
    cmds:
      # Needs a GPU, so it sits with smoke, validate and determinism rather than
      # in `task ci`.
      #
      # The sun and moon draw after the sky, so clouds can cover them. What they
      # must still be is depth tested: geometry writes alpha 1.0, so the sky's
      # alpha cannot mask them against terrain and never could. Without the
      # depth test a sun that has set draws on top of the hills it set behind.
      #
      # This camera puts the setting sun squarely behind a headland. Nothing in
      # the lower two thirds should be brighter than the dark terrain there, and
      # the disc is pale yellow against nearly black, so the margin is enormous.
      #
      # Light shafts are off on purpose. They sample the scene and would react
      # to the disc too, which is a real second symptom -- the sun bleeding
      # through terrain fed false light into the shaft pass -- but it makes the
      # measurement indirect.
      - |
        status=0
        d=.sky
        rm -rf $d && mkdir -p $d
        GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./09-water -frames 60           -time 0.77 -pitch 0.18 -yaw 2.4 -clouds 0 -stars 0 -band 0 -shafts 0           -screenshot $d/sun.png >/dev/null 2>&1
        if [ ! -s $d/sun.png ]; then
          echo "MISSING CAPTURE -- this gate proves nothing"
          exit 1
        fi
        go run ../cmd/skycheck -in $d/sun.png -y0 240 -max 120 || status=1
        rm -rf $d
        exit $status

  determinism:
    desc: "Check that a fixed frame clock makes renders byte-identical"
    dir: examples
    cmds:
      # Needs a GPU, so it sits with smoke and validate rather than in `task ci`.
      #
      # The scenes here are the ones that move on their own: wind and clouds,
      # water, particle spawns, animation sampling. A still scene would pass
      # this without proving anything.
      # The output paths are relative on purpose: the examples resolve them
      # against their own working directory, and a Windows Go binary cannot
      # open the POSIX path mktemp hands back.
      - |
        status=0
        d=.determinism
        rm -rf $d && mkdir -p $d
        shot() { GLYPHENGINE_FIXED_FRAME_TIME=$1 go run ./$2 -frames 90 $4 -screenshot $d/$3.png >/dev/null 2>&1; }
        same() {
          [ -s "$d/$1.png" ] && [ -s "$d/$2.png" ] || { echo "MISSING CAPTURE -- this gate proves nothing"; status=1; return 1; }
          [ "$(sha256sum < $d/$1.png)" = "$(sha256sum < $d/$2.png)" ]
        }
        for ex in "08-grass" "09-water" "12-particles" "06-skinned -demo" "15-kitchen-sink -demo"; do
          set -- $ex
          name=$1; shift
          shot 16.667ms $name a "$*"
          shot 16.667ms $name b "$*"
          if same a b; then
            echo "$name: identical"
          elif [ $? -eq 1 ] && [ -s $d/a.png ]; then
            echo "$name: TWO RUNS DIFFER under a fixed clock"
            status=1
          fi
        done
        # A paused world must be frozen, not merely slowed. 09-water is the
        # scene for it because the things that move there run off different
        # clocks: the waves and shoreline foam off the elapsed clock the shaders
        # read, the sun off Scene.Tick. Two captures taken 60 frames apart after
        # the pause are identical only if SetTimeScale stopped all of them.
        GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./09-water -frames 60 -pauseat 30 -screenshot $d/p1.png >/dev/null 2>&1
        GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./09-water -frames 120 -pauseat 30 -screenshot $d/p2.png >/dev/null 2>&1
        if same p1 p2; then
          echo "pause: world frozen, as it must be"
        else
          echo "pause: THE WORLD KEPT MOVING WHILE PAUSED"
          status=1
        fi

        # Prove the check is not vacuous: with the real clock the same two runs
        # must NOT match, or it is passing on a scene that never moves -- or on
        # captures that were never written.
        go run ./08-grass -frames 90 -screenshot $d/c.png >/dev/null 2>&1
        go run ./08-grass -frames 90 -screenshot $d/e.png >/dev/null 2>&1
        if same c e; then
          echo "control: 08-grass matched WITHOUT a fixed clock -- this gate proves nothing"
          status=1
        else
          echo "control: differs without the fixed clock, as it must"
        fi
        rm -rf $d
        exit $status

  screenshots:
    desc: Regenerate the documentation images in docs/images
    dir: examples
    env:
      # A fixed clock makes these reproducible: the same commit regenerates the
      # same bytes, so a diff in docs/images means the renderer changed rather
      # than that the wind was somewhere else. See WithFixedFrameTime.
      GLYPHENGINE_FIXED_FRAME_TIME: 16.667ms
    cmds:
      - go run ./01-triangle -frames 30 -screenshot ../docs/images/01-triangle.png
      - go run ./02-cube -frames 150 -screenshot ../docs/images/02-cube.png
      - go run ./03-physics -frames 150 -screenshot ../docs/images/03-physics.png
      - go run ./05-textures -frames 90 -screenshot ../docs/images/05-textures.png
      - go run ./06-skinned -demo -frames 200 -screenshot ../docs/images/06-skinned.png
      - go run ./07-terrain -frames 150 -screenshot ../docs/images/07-terrain.png
      - go run ./08-grass -frames 150 -screenshot ../docs/images/08-grass.png
      - go run ./09-water -frames 150 -screenshot ../docs/images/09-water.png
      - go run ./11-lights -frames 90 -screenshot ../docs/images/11-lights.png
      - go run ./12-particles -frames 150 -screenshot ../docs/images/12-particles.png
      - go run ./13-ui -frames 90 -screenshot ../docs/images/13-ui.png
      - go run ./10-text -frames 90 -screenshot ../docs/images/10-text.png
      - go run ./16-materials -frames 150 -screenshot ../docs/images/16-materials.png
      - go run ./17-input -frames 60 -screenshot ../docs/images/17-input.png
      - go run ./18-translucent -frames 120 -screenshot ../docs/images/18-translucent.png
      - go run ./19-instanced -frames 60 -screenshot ../docs/images/19-instanced.png
      - go run ./20-screens -frames 60 -screenshot ../docs/images/20-screens.png
      - go run ./15-kitchen-sink -demo -frames 260 -screenshot ../docs/images/15-kitchen-sink.png

  hud:
    desc: "Check that screen-space overlays survive the post-process chain"
    dir: examples
    cmds:
      # Needs a GPU, so it sits with smoke, validate and determinism rather
      # than in `task ci`.
      #
      # 09-water is the scene that catches this, because the failure needs both
      # water and text in the same frame -- which is why neither `task smoke`
      # nor `task validate` ever saw it. Overlays used to be recorded in the
      # scene pass, so the HUD sat in the HDR image that water copies to refract
      # through: the surface drew over text that writes no depth, and what came
      # back was five lines missing outright and four more warped along the
      # waves.
      #
      # -hud draws the same string on every line. Identical lines are the whole
      # trick: a line over bright sky and a line over dark water are the same
      # draw, so any difference in what survives between them is the renderer's,
      # and hudcheck recovers per-line glyph coverage by differencing against the
      # same frame with the HUD off. See cmd/hudcheck for the arithmetic.
      - |
        status=0
        d=.hud
        rm -rf $d && mkdir -p $d
        shot() { GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./09-water -frames 90 -hud $1 -screenshot $d/$2.png $3 >/dev/null 2>&1; }
        pair() {
          name=$1; shift
          shot 26 $name-hud "$*"
          shot 0  $name-bare "$*"
          if [ ! -s "$d/$name-hud.png" ] || [ ! -s "$d/$name-bare.png" ]; then
            echo "$name: MISSING CAPTURE -- this gate proves nothing"
            status=1
            return
          fi
          echo "── $name ──"
          go run ../cmd/hudcheck -a $d/$name-hud.png -b $d/$name-bare.png -lines 26 || status=1
        }
        # Stock scene: the text block crosses the waterline, which is the
        # failure as reported.
        pair water
        # Bloom low enough that white text clears the threshold, and the camera
        # pitched down so the sky does not blow out behind the text and take the
        # measurement with it. This is the run that exercises the second half:
        # overlays inside the scene target fed the bloom chain, so the HUD glowed
        # into the frame around it. Before the move this pair reported 25 of 26
        # lines lost and 74268 scene pixels perturbed.
        pair bloom -pitch 0.45 -bloom 0.7 -bloomthreshold 0.5
        rm -rf $d
        exit $status

  lights:
    desc: "Check that clustered lighting renders exactly what brute force does"
    dir: examples
    cmds:
      # Needs a GPU, so it sits with smoke, validate and determinism rather
      # than in `task ci`.
      #
      # Why exact equality is the right bar, rather than a tolerance: both
      # modes run the same shader over the same uploaded light array in the
      # same relative order, and a light that does not reach a fragment adds
      # exactly +0.0 to that fragment's sum. Clustering can only change which
      # lights a fragment skips, so if it skips only lights that contribute
      # nothing the bytes are identical. Any difference is therefore a light
      # missing from a froxel it belongs in, and it will be tile-shaped --
      # which is also why a tolerance would be the wrong instrument: a lost
      # light is a few percent of one tile's brightness, and any threshold
      # loose enough to absorb "noise" absorbs that too.
      #
      # The scene is 400 dim lamps of range 4 on a 1.6 m grid plus 32 spots.
      # The ring the example lights by default would not do: every one of its
      # lights reaches most of the scene, so every froxel lists all of them
      # and the two modes would agree even with the binner deleted.
      #
      # The near pose is the one that matters. -camdist 0.8 puts the eye half
      # a metre up with the floor 0.6 m away, inside about forty lamp spheres:
      # lights whose screen bound does not exist, fragments in the first depth
      # slice, and a camera the consumer game's players spend their time in.
      # 40 unbounded lights and 21 screen-wide ones, against 8 and 0 from the
      # overview pose.
      #
      # PROVED: with the sphere test in lightcluster's Builder.bin shrunk to
      # 0.8*radius -- a binner that is fast, plausible and not conservative --
      # all four pose/resolution pairs report CLUSTERED AND BRUTE FORCE
      # DIFFER. Restored immediately after.
      #
      # What that failure looks like is the argument for comparing bytes.
      # Measured on the kept captures at 1920x1080: the near pose differs on
      # 25.8% of its pixels and the overview on 0.36%, and in both the largest
      # channel difference anywhere is ONE of 255. The lights a shrunk sphere
      # loses are the ones whose range barely reaches the froxel, so what goes
      # missing is the dim tail of a falloff, not a tile of black -- almost
      # invisible to the eye and to any RMS threshold, on a binner that is
      # genuinely wrong. An exact comparison is the only instrument that
      # reports it, and it is free.
      - |
        status=0
        d=.lights
        rm -rf $d && mkdir -p $d
        shot() {
          mode=$1; out=$2; w=$3; h=$4; shift 4
          GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./11-lights -frames 60 \
            -width $w -height $h -lightdebug "$mode" "$@" \
            -screenshot $d/$out.png >/dev/null 2>&1
        }
        # A missing capture returns 2, not 1, so "the run died" cannot be read
        # as "the images match". Every call site is an `if`, because the task
        # runner's shell exits on the first failing command otherwise -- which
        # would report the first bad pose and never look at the other three.
        same() {
          [ -s "$d/$1.png" ] && [ -s "$d/$2.png" ] || return 2
          [ "$(sha256sum < $d/$1.png)" = "$(sha256sum < $d/$2.png)" ]
        }
        pair() {
          name=$1; w=$2; h=$3; shift 3
          shot ""           $name-clustered $w $h -lamps 400 -spots 32 "$@"
          shot bruteforce   $name-brute     $w $h -lamps 400 -spots 32 "$@"
          if same $name-clustered $name-brute; then
            echo "$name ${w}x${h}: identical"
          elif [ $? -eq 1 ]; then
            echo "$name ${w}x${h}: CLUSTERED AND BRUTE FORCE DIFFER"
            status=1
          else
            echo "$name ${w}x${h}: MISSING CAPTURE -- this gate proves nothing"
            status=1
          fi
        }
        pair overview 1280 720
        pair overview 1920 1080
        pair near 1280 720  -camdist 0.8 -campitch 0.6 -camtarget 0.05 -camlook 0
        pair near 1920 1080 -camdist 0.8 -campitch 0.6 -camtarget 0.05 -camlook 0
        # The two modes are only required to agree while nothing is being
        # dropped. A cell over its light cap, a spent index buffer or a light
        # over the frame budget all make clustered differ from brute force for
        # a reason that is not a binning bug -- so if the scene ever grows
        # into one of them, say that instead of blaming the binner. The
        # denser overview pose is the one that would hit it first: it peaks at
        # 67 lights in a cell against the near pose's 36, of a cap of 128.
        # Checked against a scene that does drop lights (-count 1024, which
        # overflows 1956 cells and drops 30 over budget): the case below
        # rejects it.
        stats=$(GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./11-lights -frames 30 \
          -lamps 400 -spots 32 -lightstats 2>&1 | sed -n 's/.*light stats: //p')
        echo "binner: $stats"
        case "$stats" in
          *DroppedOverBudget:0\ *CellsOverflowed:0\ *CellsTruncated:0\ *) ;;
          *) echo "the scene drops lights before the comparison starts -- it is not a clean oracle"
             status=1 ;;
        esac
        # Prove the comparison can say no. One lamp fewer, everything else the
        # same: if these match, the captures are not of the scene that was
        # asked for and every "identical" above means nothing.
        shot "" control-400 1280 720 -lamps 400 -spots 32
        shot "" control-399 1280 720 -lamps 399 -spots 32
        if same control-400 control-399; then
          echo "control: dropping a lamp changed nothing -- this gate proves nothing"
          status=1
        else
          echo "control: one lamp fewer changes the capture, as it must"
        fi
        # A failure here is a picture, so keep the pictures: the clustered and
        # brute-force captures of the pose that failed are what say whether the
        # difference is tile-shaped, and re-running to get them back means
        # guessing which pose it was.
        if [ $status -ne 0 ]; then
          echo "captures kept in examples/$d"
        else
          rm -rf $d
        fi
        exit $status

  bench:
    desc: Run the benchmark scenes and print CPU/GPU cost per pass
    cmds:
      # Needs a GPU. Timings come from GPU timestamp queries and the engine's own
      # per-phase CPU timer, so this does not need vsync off -- which is the
      # point, since the old way of benchmarking pegged the card audibly.
      #
      # No committed baseline to compare against: frame cost depends on the GPU,
      # the driver, the display mode and what else is running, so a stored number
      # would be from someone else's machine. Run it before and after a change.
      - go run ./cmd/bench {{.CLI_ARGS}}

  ci:
    desc: Run everything CI runs
    cmds:
      - task: lint
      - task: build
      - task: test
      - task: test:race

  clean:
    desc: Remove build output
    cmds:
      - rm -rf dist .task
