  hud:
    desc: "Check that screen-space overlays survive the post-process chain"
    dir: examples
    cmds:
      # Needs a GPU, so it sits with smoke, validate and determinism rather
      # than in `task ci`.
      #
      # 09-water is the scene that catches this, because the failure needs both
      # water and text in the same frame -- which is why neither `task smoke`
      # nor `task validate` ever saw it. Overlays used to be recorded in the
      # scene pass, so the HUD sat in the HDR image that water copies to refract
      # through: the surface drew over text that writes no depth, and what came
      # back was five lines missing outright and four more warped along the
      # waves.
      #
      # -hud draws the same string on every line. Identical lines are the whole
      # trick: a line over bright sky and a line over dark water are the same
      # draw, so any difference in what survives between them is the renderer's,
      # and hudcheck recovers per-line glyph coverage by differencing against the
      # same frame with the HUD off. See cmd/hudcheck for the arithmetic.
      - |
        status=0
        d=../.task/hud
        rm -rf $d && mkdir -p $d
        shot() { GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./09-water -frames 90 -hud $1 -screenshot $d/$2.png $3 >/dev/null 2>&1; }
        pair() {
          name=$1; shift
          shot 26 $name-hud "$*"
          shot 0  $name-bare "$*"
          if [ ! -s "$d/$name-hud.png" ] || [ ! -s "$d/$name-bare.png" ]; then
            echo "$name: MISSING CAPTURE -- this gate proves nothing"
            status=1
            return
          fi
          echo "── $name ──"
          go run ../cmd/hudcheck -a $d/$name-hud.png -b $d/$name-bare.png -lines 26 || status=1
        }
        # Every configuration runs twice, once on each path the screen-space
        # channels can take: straight onto the swapchain, and through the UI
        # glow layer (-uiglow). Nothing in this scene asks to emit, so the layer
        # is supposed to change no colour at all here -- and "the HUD survives
        # water, bloom and the tonemap" is a statement about a path, so a second
        # path is a second thing to say it about. The layer's own gate is
        # `task uiglow`; this is the one that says the layer did not cost the
        # HUD anything it already had.
        #
        # No threshold was loosened to let the layer through. hudcheck's bleed
        # counter is still zero-tolerance and the per-line tolerance is still
        # the 20 % it was.
        both() {
          name=$1; shift
          pair $name "$@"
          pair $name-glow -uiglow "$@"
        }
        # Stock scene: the text block crosses the waterline, which is the
        # failure as reported.
        both water
        # Bloom low enough that white text clears the threshold, and the camera
        # pitched down so the sky does not blow out behind the text and take the
        # measurement with it. This is the run that exercises the second half:
        # overlays inside the scene target fed the bloom chain, so the HUD glowed
        # into the frame around it. Before the move this pair reported 25 of 26
        # lines lost and 74268 scene pixels perturbed.
        #
        # It is also what says the UI glow layer did not reintroduce that: the
        # -uiglow arm puts a bright white HUD through a layer with a bloom chain
        # of its own, and the scene outside the HUD's rows still has to be
        # untouched.
        both bloom -pitch 0.45 -bloom 0.7 -bloomthreshold 0.5
        rm -rf $d
        exit $status

  lights:
    desc: "Check that clustered lighting renders exactly what brute force does"
    dir: examples
    cmds:
      # Needs a GPU, so it sits with smoke, validate and determinism rather
      # than in `task ci`.
      #
      # Why exact equality is the right bar, rather than a tolerance: both
      # modes run the same shader over the same uploaded light array in the
      # same relative order, and a light that does not reach a fragment adds
      # exactly +0.0 to that fragment's sum. Clustering can only change which
      # lights a fragment skips, so if it skips only lights that contribute
      # nothing the bytes are identical. Any difference is therefore a light
      # missing from a froxel it belongs in, and it will be tile-shaped --
      # which is also why a tolerance would be the wrong instrument: a lost
      # light is a few percent of one tile's brightness, and any threshold
      # loose enough to absorb "noise" absorbs that too.
      #
      # The scene is 400 dim lamps of range 4 on a 1.6 m grid plus 32 spots.
      # The ring the example lights by default would not do: every one of its
      # lights reaches most of the scene, so every froxel lists all of them
      # and the two modes would agree even with the binner deleted.
      #
      # The near pose is the one that matters. -camdist 0.8 puts the eye half
      # a metre up with the floor 0.6 m away, inside about forty lamp spheres:
      # lights whose screen bound does not exist, fragments in the first depth
      # slice, and a camera the consumer game's players spend their time in.
      # 40 unbounded lights and 21 screen-wide ones, against 8 and 0 from the
      # overview pose.
      #
      # PROVED: with the sphere test in lightcluster's Builder.bin shrunk to
      # 0.8*radius -- a binner that is fast, plausible and not conservative --
      # all four pose/resolution pairs report CLUSTERED AND BRUTE FORCE
      # DIFFER. Restored immediately after.
      #
      # What that failure looks like is the argument for comparing bytes.
      # Measured on the kept captures at 1920x1080: the near pose differs on
      # 25.8% of its pixels and the overview on 0.36%, and in both the largest
      # channel difference anywhere is ONE of 255. The lights a shrunk sphere
      # loses are the ones whose range barely reaches the froxel, so what goes
      # missing is the dim tail of a falloff, not a tile of black -- almost
      # invisible to the eye and to any RMS threshold, on a binner that is
      # genuinely wrong. An exact comparison is the only instrument that
      # reports it, and it is free.
      - |
        status=0
        d=.lights
        rm -rf $d && mkdir -p $d
        shot() {
          mode=$1; out=$2; w=$3; h=$4; shift 4
          GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./11-lights -frames 60 \
            -width $w -height $h -lightdebug "$mode" "$@" \
            -screenshot $d/$out.png >/dev/null 2>&1
        }
        # A missing capture returns 2, not 1, so "the run died" cannot be read
        # as "the images match". Every call site is an `if`, because the task
        # runner's shell exits on the first failing command otherwise -- which
        # would report the first bad pose and never look at the other three.
        # diff rather than sha256sum, which the shell task runs on Windows does
        # not have: both hashes came back empty, every pair compared equal, and
        # the gate printed a column of "identical" while comparing nothing.
        # Proved below before any capture is judged, the same way `task
        # determinism` does it.
        same() {
          [ -s "$d/$1.png" ] && [ -s "$d/$2.png" ] || return 2
          diff -q "$d/$1.png" "$d/$2.png" >/dev/null 2>&1
        }
        printf a > $d/selfa.png; printf a > $d/selfb.png
        same selfa selfb || { echo "SELF-CHECK: two identical files compared unequal -- this gate proves nothing"; exit 1; }
        printf b > $d/selfb.png
        if same selfa selfb; then
          echo "SELF-CHECK: two different files compared equal -- this gate proves nothing"
          exit 1
        fi
        rm -f $d/selfa.png $d/selfb.png
        pair() {
          name=$1; w=$2; h=$3; shift 3
          shot ""           $name-clustered $w $h -lamps 400 -spots 32 "$@"
          shot bruteforce   $name-brute     $w $h -lamps 400 -spots 32 "$@"
          if same $name-clustered $name-brute; then
            echo "$name ${w}x${h}: identical"
          elif [ $? -eq 1 ]; then
            echo "$name ${w}x${h}: CLUSTERED AND BRUTE FORCE DIFFER"
            status=1
          else
            echo "$name ${w}x${h}: MISSING CAPTURE -- this gate proves nothing"
            status=1
          fi
        }
        pair overview 1280 720
        pair overview 1920 1080
        pair near 1280 720  -camdist 0.8 -campitch 0.6 -camtarget 0.05 -camlook 0
        pair near 1920 1080 -camdist 0.8 -campitch 0.6 -camtarget 0.05 -camlook 0
        # 21-streetlights is the other scene that places lights, and a
        # different shape of one: six cones thrown down walls onto terrain
        # plus a ring of lamps, rather than a floor of hundreds of spheres.
        # Cones are the part 11-lights' grid does not exercise the same way --
        # a spot's bound is its range sphere, so every froxel a cone misses
        # inside that sphere is a light the shader has to reject rather than
        # one the binner dropped -- and -lamps 300 packs the ring tightly
        # enough that cells hold both kinds at once.
        sshot() {
          mode=$1; out=$2; shift 2
          GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./21-streetlights -frames 60 \
            -width 1280 -height 720 -lightdebug "$mode" "$@" \
            -screenshot $d/$out.png >/dev/null 2>&1
        }
        spair() {
          name=$1; shift
          sshot ""           street-$name-clustered "$@"
          sshot bruteforce   street-$name-brute     "$@"
          if same street-$name-clustered street-$name-brute; then
            echo "21-streetlights $name: identical"
          elif [ $? -eq 1 ]; then
            echo "21-streetlights $name: CLUSTERED AND BRUTE FORCE DIFFER"
            status=1
          else
            echo "21-streetlights $name: MISSING CAPTURE -- this gate proves nothing"
            status=1
          fi
        }
        spair default
        spair lamps300 -lamps 300
        # And the same scene with every light asking for volumetric
        # in-scattering. This is not a spare pair: the march walks the froxel
        # lists a SECOND time, at up to 32 sample points per pixel rather than
        # once at the fragment, so it reads cells the surface shading never
        # touches -- every cell along the ray instead of the one the surface
        # is in. A binner that is wrong about a cell no surface happens to sit
        # in is invisible to every pair above and visible here.
        #
        # It stays an exact comparison for the same reason they do. Brute
        # force marches every uploaded light at every step; clustered marches
        # the cell's list. A light not in a cell cannot reach any point of it,
        # so it contributes exactly +0.0 at a sample inside that cell -- the
        # range test and the cone smoothstep both return exact zeros -- and
        # the two sums are the same adds in the same order.
        #
        # -skylamp is in here because the SKY takes this path too now, and by
        # a different route: sky.frag reads the light buffers through its own
        # pipeline layout and its own march, so a sky pixel is a second
        # implementation of the same walk. No other pair in this gate covers
        # it at all.
        spair volumetric -volumetric 1 -lampvolumetric 1 -skylamp
        spair volumetric-dense -volumetric 1 -lampvolumetric 1 -lamps 300
        # 09-water is the third scene and the only one with a water surface.
        # It has to be here rather than be assumed covered: water.frag is not
        # one of the shaders that call evalLighting*, it runs its own copy of
        # the light loop over the same resolveLightRange/lightAt, so it is a
        # second place the two modes can be made to disagree and the first two
        # scenes do not touch it at all. The surface also reaches the grid
        # differently from anything else here -- it is drawn in the water pass,
        # from the same camera but after the depth buffer is final, and a
        # near-horizontal lake spans almost every depth slice in one draw.
        wshot() {
          mode=$1; out=$2; w=$3; h=$4; shift 4
          GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./09-water -frames 150 \
            -width $w -height $h -lightdebug "$mode" "$@" \
            -screenshot $d/$out.png >/dev/null 2>&1
        }
        wpair() {
          name=$1; w=$2; h=$3; shift 3
          wshot ""         water-$name-clustered $w $h "$@"
          wshot bruteforce water-$name-brute     $w $h "$@"
          if same water-$name-clustered water-$name-brute; then
            echo "09-water $name ${w}x${h}: identical"
          elif [ $? -eq 1 ]; then
            echo "09-water $name ${w}x${h}: CLUSTERED AND BRUTE FORCE DIFFER"
            status=1
          else
            echo "09-water $name ${w}x${h}: MISSING CAPTURE -- this gate proves nothing"
            status=1
          fi
        }
        wpair reflections 1280 720  -time 0.02 -lamps 9 -spots 2
        wpair reflections 1920 1080 -time 0.02 -lamps 9 -spots 2
        # Enough lights over the lake that a froxel holds several of them, with
        # the piles off so the surface is not occluded by its own fixtures.
        wpair dense 1280 720 -time 0.02 -lamps 120 -spots 4 -lampposts=false
        # PROVED again on these three, with the same 0.8*radius sphere test in
        # lightcluster's Builder.bin: all three report CLUSTERED AND BRUTE
        # FORCE DIFFER. Restored from a copy immediately after.
        #
        # And water fails LOUDER than the rest of this gate, which is worth
        # knowing. The argument above says a lost light is the dim tail of a
        # falloff, one step of 255, invisible to any tolerance. That is true of
        # a diffuse surface. On water a lamp arrives only as a specular lobe of
        # exponent 220, so a light missing from a froxel does not dim a
        # gradient -- it deletes a whole glint. The dense pose differs on 4.45%
        # of the frame with a largest channel difference of 42 of 255, and
        # every one of those pixels is in the water band: 41035 of 41035, or
        # 11.4% of it. The 1920x1080 reflections pose differs on 0.79% with a
        # largest difference of 17. The exact comparison is still the right
        # instrument -- it is free and it catches both -- but a reader
        # measuring a water failure should not expect the 1/255 recorded above.
        # The two modes are only required to agree while nothing is being
        # dropped. A cell over its light cap, a spent index buffer or a light
        # over the frame budget all make clustered differ from brute force for
        # a reason that is not a binning bug -- so if the scene ever grows
        # into one of them, say that instead of blaming the binner. The
        # denser overview pose is the one that would hit it first: it peaks at
        # 67 lights in a cell against the near pose's 36, of a cap of 128.
        # Checked against a scene that does drop lights (-count 1024, which
        # overflows 1956 cells and drops 30 over budget): the case below
        # rejects it.
        # grep and a parameter expansion rather than sed, which the shell task
        # runs on Windows does not have either -- and a missing sed took the
        # whole gate down with exit 127 after it had already printed six
        # meaningless "identical" lines.
        raw=$(GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./11-lights -frames 30 \
          -lamps 400 -spots 32 -lightstats 2>&1 | grep 'light stats: ')
        stats=${raw##*light stats: }
        echo "binner: $stats"
        case "$stats" in
          *DroppedOverBudget:0\ *CellsOverflowed:0\ *CellsTruncated:0\ *) ;;
          *) echo "the scene drops lights before the comparison starts -- it is not a clean oracle"
             status=1 ;;
        esac
        # Prove the comparison can say no. One lamp fewer, everything else the
        # same: if these match, the captures are not of the scene that was
        # asked for and every "identical" above means nothing.
        shot "" control-400 1280 720 -lamps 400 -spots 32
        shot "" control-399 1280 720 -lamps 399 -spots 32
        if same control-400 control-399; then
          echo "control: dropping a lamp changed nothing -- this gate proves nothing"
          status=1
        else
          echo "control: one lamp fewer changes the capture, as it must"
        fi
        # A failure here is a picture, so keep the pictures: the clustered and
        # brute-force captures of the pose that failed are what say whether the
        # difference is tile-shaped, and re-running to get them back means
        # guessing which pose it was.
        if [ $status -ne 0 ]; then
          echo "captures kept in examples/$d"
        else
          rm -rf $d
        fi
        exit $status

  waterblend:
    desc: "Check that a blended effect in front of the water is not painted over by it"
    dir: examples
    cmds:
      # Needs a GPU, so it sits with smoke, validate and determinism rather
      # than in `task ci`.
      #
      # Water is drawn last, in a second pass, because refraction samples the
      # finished frame. Nothing blended writes depth, so where a flame stood in
      # front of the lake the depth buffer held the lake BED, the water passed
      # the depth test, and the flame was painted over: cut off dead flat at
      # the waterline, fine against sky and gone against water. Issue #45.
      #
      # Nothing else saw it and nothing else could. `task smoke` renders the
      # frame, `task validate` is silent, `task determinism` is happy because
      # the wrong image is wrong the same way every time -- and no example had
      # water and a blended effect in the same scene at all until 09-water grew
      # these flags.
      #
      # The pair is the whole trick, the same way it is in `task hud`. A single
      # frame cannot say what should have been there, so the plume is toggled
      # and the difference is the light it ADDED: a bright lake cannot fake
      # that, because the same lake is under both captures and subtracts out.
      # The -ref box over sky is the same plume in the same pair, and it makes
      # the reading self-calibrating -- "as present below the waterline as
      # above it" is a claim no fixed threshold can carry.
      #
      # PROVED: with blendSplit.active forced to false -- every blended draw
      # back before the refraction copy, which is the order that shipped -- the
      # box over water reads +4.2 mean luma against +76.9 with the fix, a ratio
      # of 0.115 against 2.096. Both floors bite. Restored immediately after.
      #
      # The remaining +4.2 is why there is a ratio floor and not just "greater
      # than zero": the swallowed plume is still in the refraction copy, so the
      # water shows an absorbed, smeared ghost of it rather than nothing.
      #
      # The control box over sky reads +36.7 either way, to the tenth. That
      # half of the plume was never the broken half, and a run where it moves
      # is a run where the camera or the emitter changed, so nothing measured
      # below the waterline in it would mean anything -- which is what -minref
      # is for.
      - |
        status=0
        d=../.task/waterblend
        rm -rf $d && mkdir -p $d
        shot() { GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./09-water -frames 150 "$@" >/dev/null 2>&1; }
        shot -plume -ghost -marker -submerged -screenshot $d/plume.png
        shot -ghost -marker -submerged -screenshot $d/bare.png
        if [ ! -s $d/plume.png ] || [ ! -s $d/bare.png ]; then
          echo "MISSING CAPTURE -- this gate proves nothing"
          exit 1
        fi
        go run ../cmd/blendcheck -a $d/plume.png -b $d/bare.png \
          -box 300,420,90,200 -ref 300,250,90,130 -min 25 -minref 20 -ratio 0.8 || status=1
        # A failure here is a picture: whether the plume stops at the waterline
        # or is merely dimmer is the difference between this bug and a lighting
        # change, and re-running to get the captures back wastes the evidence.
        if [ $status -ne 0 ]; then
          echo "captures kept in examples/$d"
        else
          rm -rf $d
        fi
        exit $status

  custompasses:
    desc: "Application light/compute/fog passes are visible, confined, deterministic and validation-clean"
    dir: examples
    env:
      GLYPHENGINE_BACKGROUND: "1"
      GLYPHENGINE_FIXED_FRAME_TIME: "16.667ms"
    cmds:
      # 960x540, frame 120, RX 7900 XTX: ground box (180,285)-(930,470)
      # has 41325 pixels >=8/255, maximum contrast 109/255. N=30000 leaves
      # margin below that measured count; contrast has an absolute 8/255 floor.
      # Fog above the horizon (100,175)-(860,200): 19000 >=8/255, max 50/255;
      # require 15000. Upper sky (100,20)-(860,80): exactly 0 changed pixels.
      # The ground box includes the overlapping rectangles; starting at y=345
      # misses their overlap and reports the same visible count without blending.
      # PROVED: BlendNone in the pattern pass still passes (a), but drops the
      # ground count to 41289 and maximum contrast to 66/255. Restored afterward.
      # PROVED: adding 0.05 RGB in the composite writes the upper sky and
      # fails (c): 45600 sky pixels change (max 10/255). Restored afterward.
      # PROVED: without the fixed clock, two frame-120 captures differ in
      # 157 pixels (max 1/255); byte identity fails even below the visibility
      # floor. Both controls were restored before the final gate run.
      # Isolation controls in scratch copies: no pattern draws leaves only
      # 185 ground pixels >=8/255 (fails a); disabling the fog pass leaves
      # 0 fog pixels changed (fails b) while 41136 ground pixels remain visible.
      - |
        set -e
        d=../.task/custompasses
        mkdir -p $d
        rm -f $d/on.png $d/off.png $d/repeat.png
        shot() {
          name=$1; shift
          if ! go run ./24-custom-passes -frames 120 "$@" -screenshot $d/$name.png >$d/$name.log 2>&1; then
            cat $d/$name.log
            exit 1
          fi
        }
        shot on -passes on -timings
        shot off -passes off
        shot repeat -passes on
        go run ../cmd/custompassescheck -on $d/on.png -off $d/off.png -repeat $d/repeat.png
        if ! GLYPHENGINE_VALIDATION=1 GLYPHENGINE_PROVOKE_RECREATE_FRAMES=15,60,90 go run ./24-custom-passes -frames 120 >$d/validation.log 2>&1; then
          cat $d/validation.log
          exit 1
        fi
        # Prove the message counter works before accepting a silent log.
        probe=$(echo "VULKAN ERROR: self-check" | grep -cE "VULKAN (ERROR|WARNING)" || true)
        [ "$probe" = "1" ] || { echo "cannot count validation messages"; exit 1; }
        grep -q "Vulkan validation layer enabled" $d/validation.log || { cat $d/validation.log; exit 1; }
        msgs=$(grep -cE "VULKAN (ERROR|WARNING)" $d/validation.log || true)
        [ "$msgs" = "0" ] || { cat $d/validation.log; exit 1; }
        rebuilds=$(grep -c "Swapchain recreated:" $d/validation.log || true)
        [ "$rebuilds" -ge 3 ] || { cat $d/validation.log; exit 1; }
        echo "24-custom-passes: recreate at 15,60,90; 0 validation messages"
        echo "captures and logs kept in .task/custompasses"
      - |
        cd ..
        go run ./cmd/apppasscheck -filter -frames 24 -validate -provoke-recreate -screenshot .task/custompasses/filter.png

  shafts:
    desc: "Check that light shafts reach through the gaps between occluders"
    dir: examples
    cmds:
      # Needs a GPU, so it sits with smoke, validate and determinism rather
      # than in `task ci`.
      #
      # This gate exists because the feature it tests did not, for seven weeks.
      # godray.frag was compiled and shipped, createGodRayPipeline built a
      # pipeline, recordWaterPass was handed it -- and nothing bound it, so
      # -shafts 0, 1 and 3 rendered byte-identical frames from 2026-07-29 until
      # #50. Every other gate was green throughout: smoke renders the frame,
      # validate is silent, determinism is happy because the same wrong image
      # comes out every time, and `task sky` passes -shafts 0 on purpose.
      #
      # The pair is the whole trick, the same way it is in `task waterblend`.
      # A single frame cannot say what should have been there, so the shafts
      # are toggled and the difference is the light they ADDED: a bright sunset
      # cannot fake that, because the same sky is under both captures.
      #
      # Two boxes on the terrain below the sun, chosen so that the only thing
      # between them is a pillar. The sun peeks over the ridge at the right-hand
      # edge of pillar 4, so ground to its right has an unobstructed line to the
      # disc and ground the same distance to its left has the pillar across it.
      # Terrain, not sky: the sunset sky beside the disc is already at 255 and
      # added light there is invisible to a measurement as well as to the eye.
      #
      # PROVED, on constructed files before it was believed on a render: with
      # the capture replaced by a copy of the shafts-off frame -- "nothing is
      # drawn", which is exactly today's main -- the gap gains +0.0 and the run
      # fails the absolute floor. With it replaced by the same frame plus a flat
      # +30 everywhere -- "a uniform wash", which is what this shader does with
      # no bright() threshold -- both boxes gain +30.0, the ratio is 1.000 and
      # the run fails the ratio floor. The real pair reads +31.2 and +7.4,
      # ratio 4.23, at the 0.25 default.
      #
      # And broken twice on a real build, after the fix was committed. Reverting
      # the draw commit -- main exactly as it stood for seven weeks -- reads
      # +0.0 through the gap and fails. So does keeping every other part of the
      # fix and turning off only the recordLightShafts call. In both, the second
      # arm below stayed green, which is precisely why it cannot be the only
      # arm: "nothing is drawn anywhere" passes a byte-identity test.
      #
      # The second arm is the cheap half and catches the opposite mistake. At
      # yaw 2.70 the sun lands at u = 1.275, a quarter of a frame past the right
      # edge, where shaftEdgeFade has reached zero -- so the pass must not run
      # at all -- and a frame with no water enters
      # the water pass only for the shafts, so "must not run" is also "must not
      # copy the scene". On and off have to be byte for byte the same file.
      - |
        status=0
        d=../.task/shafts
        rm -rf $d && mkdir -p $d
        shot() { GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./09-water -frames 150 "$@" >/dev/null 2>&1; }
        # Dusk, the sun rising over the ridge from behind a row of pillars.
        shot -time 0.72 -yaw 1.771 -pitch -0.185 -pillars -screenshot $d/on.png
        shot -time 0.72 -yaw 1.771 -pitch -0.185 -pillars -shafts 0 -screenshot $d/off.png
        # The same evening with the sun well off the right edge.
        shot -time 0.72 -yaw 2.70 -pitch -0.185 -pillars -screenshot $d/gone-on.png
        shot -time 0.72 -yaw 2.70 -pitch -0.185 -pillars -shafts 0 -screenshot $d/gone-off.png
        for f in on off gone-on gone-off; do
          if [ ! -s $d/$f.png ]; then
            echo "MISSING CAPTURE $f -- this gate proves nothing"
            exit 1
          fi
        done
        # -near is the foreground hillside, and it is the arm that catches the
        # failure this effect is always one constant away from. A real dirty-lens
        # render -- no brightness window, no decay, no lobe -- passes the two
        # boxes above it, ratio 2.47, because a smear of the image still has the
        # image's pillars in it; it puts +24.3 on this box, where the shipped
        # shape puts +0.2 and a lobe widened to 1.3 puts +1.3. See cmd/shaftcheck.
        #
        # Verified through this task and not only on saved captures: with
        # shaftLobeRadius alone changed from 0.90 to 50 -- the lobe gone, the
        # window and the decay untouched -- the gap reads +43.8, the streak
        # +11.0, ratio 4.00, all passing, and this box reads +6.7 and fails.
        # That is the regression the first two arms were blind to.
        go run ../cmd/shaftcheck -a $d/on.png -b $d/off.png \
          -gap 739,440,80,80 -shadow 459,440,80,80 -min 12 -ratio 2.0 \
          -near 50,600,300,100 -nearmax 4 || status=1
        if diff -q $d/gone-on.png $d/gone-off.png >/dev/null 2>&1; then
          echo "sun off screen: on and off are byte identical"
        else
          echo "  FAIL: with the sun off screen the shaft pass still changed the frame."
          echo "  shaftEdgeFade should have taken the strength to zero, and a zero strength"
          echo "  should have kept the frame out of the water pass entirely"
          status=1
        fi
        # A failure here is a picture: "no shafts at all" and "a wash over
        # everything" are the same number away from each other and nothing
        # alike to look at, so keep the pair the way `task waterblend` does.
        if [ $status -ne 0 ]; then
          echo "captures kept in examples/$d"
        else
          rm -rf $d
        fi
        exit $status

  uiglow:
    desc: "Check that UI elements that ask to glow do, onto their neighbours and nowhere else"
    cmds:
      # Needs a GPU, so it sits with smoke, validate and determinism rather
      # than in `task ci`.
      #
      # 13-ui carries the scene, because the failure needs a UI element that
      # asks to emit next to one that does not, and no other example has one.
      # -glow selects one of four configurations of the SAME geometry, which is
      # what makes each pair mean one thing:
      #
      #   direct  the second panel drawn straight onto the swapchain
      #   layer   the same panel through the UI glow layer, nothing glowing
      #   on      the same panel again, three of its elements emitting
      #
      # direct against layer is the layer's neutrality. on against layer is the
      # glow. Neither is a threshold on a single frame: the same frame is under
      # both captures and subtracts out, the way `task shafts` and
      # `task waterblend` do it.
      #
      # PROVED by breaking the real code three ways, each one run through this
      # task on a committed tree and reverted afterwards. What each printed:
      #
      #   1. the composite unbound -- recordUIResolve's CmdDraw deleted, so the
      #      layer is rendered every frame and never reaches the swapchain. The
      #      whole HUD vanishes. "the glowing and non-glowing captures are byte
      #      identical", then the neutrality arm at 98498 px differing, 98472 of
      #      them above 1/255, max delta 207; then lit +0.00 and near +0.00,
      #      both under their floors. Three arms, one cause.
      #   2. the in-layer blend put back to straight alpha -- overlayBlend's
      #      premultiplied case returning SrcAlpha while the shaders go on
      #      premultiplying, so coverage is counted twice. 60747 px differ,
      #      15204 of them above 1/255, max delta 60 against a tolerance of 2,
      #      every one of them an antialiased edge. The GLOW arm stayed
      #      completely green -- lit +49.63, near +5.64, far and scene +0.00 --
      #      which is exactly why the neutrality arm cannot be dropped.
      #   3. the glow applied per PASS rather than per object -- recordUIComposite
      #      pushing the largest Glow in the frame into pc[44] for every panel
      #      draw. The neutrality arm stayed green (5009 px, max 1/255: nothing
      #      emits in the control, so the leak is invisible there), lit went UP
      #      to +58.17 and near to +18.74 -- both comfortably passing, and the
      #      frame just looks like a HUD someone turned up. far is the only arm
      #      that fired: +43.68 against a ceiling of 0.50.
      #
      # A fourth, tried and not kept because it is caught twice over: pushing a
      # fixed 2.0 for every panel draw unconditionally. That glows in the
      # control too, so the neutrality arm fails at max delta 198 and lit fails
      # at +0.16 -- the element is already blown out before anything is asked to
      # emit -- while far reads +0.00, because the leak is in both captures.
      - |
        status=0
        d=.task/uiglow
        rm -rf $d && mkdir -p $d
        shot() { (cd examples && GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./13-ui -frames 90 -glow $1 -screenshot ../.task/uiglow/$1.png) >/dev/null 2>&1; }
        shot direct
        shot layer
        shot on
        for f in direct layer on; do
          if [ ! -s $d/$f.png ]; then
            echo "MISSING CAPTURE $f -- this gate proves nothing"
            exit 1
          fi
        done
        # Prove the comparators before trusting a word they say.
        #
        # diff, never sha256sum: sha256sum is not on the PATH of the shell task
        # runs under on this machine, both hashes come back empty, and every
        # pair compares equal. `task determinism` printed a column of
        # "identical" that meant nothing for weeks that way.
        printf a > $d/x; printf a > $d/y
        diff -q $d/x $d/y >/dev/null 2>&1 || { echo "SELF-CHECK: two identical files compared unequal -- this gate proves nothing"; exit 1; }
        printf b > $d/y
        if diff -q $d/x $d/y >/dev/null 2>&1; then
          echo "SELF-CHECK: two different files compared equal -- this gate proves nothing"
          exit 1
        fi
        rm -f $d/x $d/y
        # uiglowcheck itself, on constructed inputs whose answer is known.
        # A capture differenced against ITSELF has no glow in it anywhere, so
        # the glow arm must reject it rather than report four zeroes and pass.
        if go run ./cmd/uiglowcheck -base $d/layer.png -glow $d/layer.png \
             -lit 450,64,128,22 -near 444,164,150,14 -far 24,50,280,90 -scene 850,300,200,120 >/dev/null 2>&1; then
          echo "SELF-CHECK: a capture differenced against itself passed the glow arm -- this gate proves nothing"
          exit 1
        fi
        # And the neutrality arm, handed a pair that is obviously not neutral:
        # the glowing capture in place of the direct one.
        if go run ./cmd/uiglowcheck -direct $d/on.png -base $d/layer.png -glow $d/on.png \
             -lit 450,64,128,22 -near 444,164,150,14 -far 24,50,280,90 -scene 850,300,200,120 >/dev/null 2>&1; then
          echo "SELF-CHECK: the neutrality arm passed a pair that differs by the whole glow -- this gate proves nothing"
          exit 1
        fi
        # lit  is the emitting button (444,60 to 584,90), inset so the box does
        #      not straddle its antialiased edge.
        # near is the "coolant nominal" label ten pixels under the emitting one,
        #      which asks for nothing and is lit anyway. That is the whole
        #      feature: a game can already halo one element with WithShaders.
        # far  is the original HUD panel and its bars, clear of the glow's
        #      measured reach (which stops at x = 320).
        # scene is sky and terrain with no UI over it at all.
        #
        # First, the coarsest statement there is, and the one a box measurement
        # cannot make: layer and on differ ONLY by the Glow values, so if they
        # come out byte identical either nothing is emitting or the finished
        # layer never reaches the swapchain. Every box below then reads +0.00
        # and only lit's background floor says why. This is deliberately not
        # written as a self-check: a harness that rendered the same file twice
        # and a renderer that composites nothing produce the same picture, and
        # both are failures of the thing under test rather than of the gate.
        if diff -q $d/layer.png $d/on.png >/dev/null 2>&1; then
          echo "FAIL: the glowing and non-glowing captures are byte identical."
          echo "  Either no element is emitting or the finished layer never reaches the swapchain."
          echo "  Check that recordUIResolve still draws, that the graph's bloom stages run over the UI layer,"
          echo "  and that SetUIGlow's threshold is still below what an element can reach."
          status=1
        fi
        go run ./cmd/uiglowcheck -direct $d/direct.png -base $d/layer.png -glow $d/on.png \
          -lit 450,64,128,22 -near 444,164,150,14 -far 24,50,280,90 -scene 850,300,200,120 || status=1
        # A failure here is a picture: "no glow at all" and "everything glows"
        # are the same number apart and nothing alike to look at, so keep the
        # captures the way `task shafts` and `task waterblend` do.
        if [ $status -ne 0 ]; then
          echo "captures kept in $d"
        else
          rm -rf $d
        fi
        exit $status

  nightlight:
    desc: "Check that lamplight still reads as lamplight after the night shift"
    dir: examples
    cmds:
      # Needs a GPU, so it sits with smoke, validate, determinism and lights
      # rather than in `task ci`.
      #
      # atmNightShift blends night-time surfaces toward a blue-weighted grey,
      # and it used to do that on sun altitude alone. At full night that blend
      # is one-sided -- the shifted blue channel lands above the shifted green
      # for every colour with no negative channel -- so a warm lamp could not
      # put a warm pool on the ground no matter what colour or intensity it
      # was given. Nothing else here notices: `task smoke` renders the frame,
      # `task validate` says the layer is happy and `task determinism` says
      # two runs agree, and all three were green for as long as it lasted.
      #
      # The capture is the doorway close-up rather than the overview, because
      # the pool has to be a large enough patch of one surface to average.
      # See cmd/lampcheck for the boxes and for the ablation that shows this
      # fails when the weighting is removed.
      #
      # -span 60 is there because the ordering test alone only catches the
      # weighting being gone, not being weak: a doorway pool is lamp-dominated
      # enough that 85% of the weighting can be thrown away and the hue still
      # comes out red above green above blue. Measured red-minus-blue across
      # the pool box at local-term weights 1.00 / 0.35 / 0.15 / 0.00: 72.5 /
      # 63.1 / 48.8 / -23.3. The floor sits between the first and the third.
      - |
        status=0
        d=.nightlight
        rm -rf $d && mkdir -p $d
        GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./21-streetlights -frames 90 \
          -width 1280 -height 720 \
          -camtargetx 22 -camtargety 1.5 -camtargetz 0 \
          -camyaw -1.5708 -campitch 0.25 -camdist 9 -camlook 0.6 \
          -screenshot $d/doorway.png >/dev/null 2>&1
        if [ ! -s $d/doorway.png ]; then
          echo "MISSING CAPTURE -- this gate proves nothing"
          exit 1
        fi
        go run ../cmd/lampcheck -i $d/doorway.png -pool 560,650,160,60 -unlit 110,640,110,60 -span 60 || status=1
        # A failure here is a picture. Keep it, the way `task lights` does.
        if [ $status -ne 0 ]; then
          echo "capture kept in examples/$d"
        else
          rm -rf $d
        fi
        exit $status

  waterlight:
    desc: "Check that a lamp beside a lake reaches the water, in the lamp's colour"
    dir: examples
    cmds:
      # Needs a GPU, so it sits with smoke, validate, determinism, lights and
      # nightlight rather than in `task ci`.
      #
      # water.frag included lighting.inc, declared LIGHT_SET, had the light
      # list bound at set 1 bindings 3-5 on every water fragment -- and never
      # read it. A lamp beside a lake lit the shore, the piles and the lake bed
      # and left the surface alone: no reflection at all, and a local-light
      # share of structurally zero, so lamplit water took the same full night
      # grade as open water under the moon. Issue #39.
      #
      # Nothing saw it and nothing could. `task smoke` renders the frame,
      # `task validate` is silent, `task determinism` is happy because the
      # wrong image is wrong the same way every time, and `task lights` needs
      # two modes to disagree -- which they cannot when neither consults the
      # grid. The real reason is simpler: no example had water and lights in
      # the same scene until 09-water grew these flags.
      #
      # The pair is the instrument, as in `task waterblend`. -lampsoff builds
      # every pile and fixture and hands the scene nothing, so the two captures
      # differ in the lights and in nothing else and the lake subtracts out.
      #
      # PROVED, twice, and the second one is the more interesting:
      #
      # Ablate the local light entirely -- delete `color += lampGlint *
      # glintGain` and force lightLocalLum to 0, which is water.frag's state
      # before this landed. The lamp box goes from R +38.56 G +32.48 B +26.52
      # to R +0.00 G +0.00 B +0.00 and the spot box from R +105.43 G +78.34
      # B +52.36 to R +0.02 G +0.02 B +0.02. Both report THE LAMPS DO NOT REACH
      # THE WATER.
      #
      # Ablate only the colour, leaving lightLocalLum set: the surface is
      # excused the night grade it has not earned, and the lamp box comes back
      # R -3.50 G +1.06 B +6.20, the spot box R -4.36 G +2.02 B +8.67. Turning
      # the lights on makes the water BLUER and takes red away. That is the
      # half of #39 that is not a missing highlight, and the ordering test is
      # what catches it -- a mean or a luma floor would read those as "the
      # water changed".
      #
      # Restored from a copy immediately after, not with git checkout.
      #
      # Both dark boxes are byte-identical in every one of those builds, which
      # is the point of them: they say the light that appeared went only where
      # a lamp reaches.
      #
      # The lit boxes go to almost exactly zero rather than keeping a residue,
      # and that is worth knowing before choosing another box: they sit on deep
      # water, where `absorbed` is 1 and the refracted bed does not show. A box
      # in the shallows would keep whatever the opaque pass put on the bed
      # there, and -min would have to clear it.
      - |
        status=0
        d=.waterlight
        rm -rf $d && mkdir -p $d
        # `shift` before "$@", or the capture's own name is passed on to the
        # example as a positional argument -- which ends Go's flag parsing, so
        # -lampsoff is silently dropped and the control renders WITH the
        # lights. Both captures then match and both boxes gain exactly 0.00.
        # Which is how this was found: the gate said the lamps do not reach the
        # water against a build where they demonstrably do.
        shot() {
          name=$1; shift
          GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./09-water -frames 150 \
            -time 0.02 -lamps 9 -spots 2 -screenshot $d/$name.png "$@" >/dev/null 2>&1
        }
        shot on
        shot off -lampsoff
        if [ ! -s $d/on.png ] || [ ! -s $d/off.png ]; then
          echo "MISSING CAPTURE -- this gate proves nothing"
          exit 1
        fi
        # Two pairs, because a point light and a spot take different routes to
        # the surface: lightIrradiance's cone factor is a no-op for the first
        # and the whole question for the second, and a spot that lit water like
        # a bare bulb would pass the lamp pair on its own.
        #
        # The dark box of each pair is far water on that side of the frame,
        # 50 metres and more out -- past the 14 of a lamp and the 30 of a spot
        # on a mast 24 out, so every light returns exactly +0.0 there.
        echo "── the nine lamps on piles ──"
        go run ../cmd/watercheck -a $d/on.png -b $d/off.png \
          -lit 620,500,60,50 -dark 240,396,80,40 -min 15 -margin 4 || status=1
        echo "── the floodlight cone ──"
        go run ../cmd/watercheck -a $d/on.png -b $d/off.png \
          -lit 880,540,110,90 -dark 960,396,80,40 -min 30 -margin 10 || status=1
        # A failure here is a picture: whether the water gained nothing or
        # gained the wrong colour is the difference between the light loop being
        # gone and the night grade being wrong, and re-running to get the
        # captures back wastes the evidence.
        if [ $status -ne 0 ]; then
          echo "captures kept in examples/$d"
        else
          rm -rf $d
        fi
        exit $status

  clouds:
    desc: "Check sunset cloud colour, cirrus, layer overlap and fixed-clock repeatability"
    dir: examples
    env:
      GLYPHENGINE_FIXED_FRAME_TIME: "16.667ms"
    cmds:
      - |
        set -eu
        d=.clouds
        mkdir -p "$d"
        go build -o "$d/water{{.EXE}}" ./09-water
        shot() {
          name=$1; shift
          # A failed capture must not reuse the previous run's image.
          rm -f "$d/$name.png"
          "./$d/water{{.EXE}}" -background -frames 120 -width 1280 -height 720 \
            -screenshot "$d/$name.png" "$@" >"$d/$name.log" 2>&1
        }
        shot gold -time 0.755 -pitch -0.38 -yaw 1.771
        shot rose -time 0.765 -pitch -0.38 -yaw 1.771
        shot noon -time 0.5 -pitch -0.38 -yaw 1.771
        shot night -time 0 -pitch -0.38 -yaw 1.771
        shot clear -time 0.5 -pitch -0.55 -clouds 0 -cirrus 0
        shot low -time 0.5 -pitch -0.55 -clouds 32 -cirrus 0
        shot high -time 0.5 -pitch -0.55 -clouds 0 -cirrus 1
        shot both -time 0.5 -pitch -0.55 -clouds 32 -cirrus 1
        shot repeat -time 0.5 -pitch -0.55 -clouds 32 -cirrus 1
        shot paused1 -time 0.755 -pitch -0.55 -yaw 1.771 -cirrus 1 -pauseat 30 -frames 60
        shot paused2 -time 0.755 -pitch -0.55 -yaw 1.771 -cirrus 1 -pauseat 30 -frames 120
        go run ../cmd/cloudcheck -dir "$d"
        echo "captures kept in examples/$d"

  skypalette:
    desc: "Check that the sky palette reaches the fog, the water and the clouds, not just the dome"
    dir: examples
    cmds:
      # Needs a GPU, so it sits with smoke, validate, determinism, lights,
      # nightlight and waterlight rather than in `task ci`.
      #
      # The six colours the sky blends between were compile-time constants in
      # atmSkyPalette, and that function is not only the sky's: applyFog fades
      # distant geometry toward the same horizon colour and water reflects the
      # dome. So a game replacing sky.frag through WithShaders -- which is what
      # the docs pointed it at -- got a violet dome over a landscape still
      # hazing into Earth-blue, with a lake reflecting the wrong one of the
      # two. Issue #12. The palette is data now, in the one uniform block all
      # three read, and this is the gate on "all three".
      #
      # Nothing else here can see it. `task smoke` renders the frame, `task
      # validate` is silent, `task determinism` is happy because the wrong
      # image is wrong the same way every time, and `task sky` only asks
      # whether the sun is occluded. The failure is a colour relationship
      # between three parts of one frame, and no single-value metric holds it.
      #
      # The pair is the instrument, as in `task waterlight` and `task
      # waterblend`: -alien against the stock palette, same scene, same clock.
      # The terrain has an albedo and the water has a body colour, so the three
      # boxes' absolute colours cannot be compared -- but everything that did
      # not change subtracts out, and what is left in each box is its own share
      # of the same change to the horizon colour. See cmd/palettecheck for why
      # the DIRECTION of that change is the invariant and its size is not.
      #
      # What it reads on the shipped build, in 8-bit steps: the sky box moves
      # 122.32, the fog box 40.05 and the water box 105.15, and the fog and the
      # water are 3.4 and 1.6 degrees off the sky's direction. They differ in
      # size by a factor of two and a half and that is expected -- see
      # cmd/palettecheck -- so the floor is set at 6, well under the smallest
      # of them and far above what the failure below leaves.
      #
      # PROVED: with lighting.inc's fogColor reading the compiled-in constants
      # while sky.frag reads the uniform -- exactly the drift this issue exists
      # to prevent -- the fog box collapses from 40.05 to 0.49 and the water
      # box from 105.15 to exactly 0.00, and both report THE PALETTE DID NOT
      # REACH. The sky box is unmoved at 122.32, which is the point: the dome
      # on its own looks completely correct, and the capture kept from that run
      # is the violet sky over the Earth-blue lake from the issue.
      #
      # And nothing else could have caught it, which is measured rather than
      # argued: that build's -alien capture is the broken one, but its capture
      # of the SAME frame under the stock palette is byte-identical to the
      # shipped build's. Every other gate in this file renders the stock
      # palette, so every other gate sees exactly the frame it saw before.
      #
      # The water going to 0.00 rather than merely shrinking is worth knowing:
      # water.frag's Fresnel reflection is fogColor() too, so breaking the fog
      # breaks the reflection with it, and the two boxes are not as independent
      # as they look. A change that fed the palette to the fog but not to
      # water.frag would still be caught, by the angle rather than the floor.
      #
      # Restored from a copy, not with git checkout.
      #
      # The fourth box is the clouds, and it is here because a second break
      # found the first three blind to them. clouds.frag calls atmSkyPalette
      # itself, for the march's ambient fill, in a pipeline nothing else reads
      # from. Handed Earth's six colours while every other caller took the
      # uniform, sky, fog and water read 122.32, 40.05 and 105.15 -- to the
      # digit what they read above -- and this gate PASSED over a frame with
      # 23.3% of its pixels wrong, by up to 22 of 255: Earth-grey cumulus
      # hanging in a violet sky. With the box, that build reads 4.13 in it
      # against the shipped build's 24.67 and reports THE PALETTE DID NOT REACH
      # THE CLOUD. The 4.13 is not noise -- it is the alien dome showing through
      # a cloud that is not opaque -- which is why this box has its own floor.
      - |
        status=0
        d=.skypalette
        rm -rf $d && mkdir -p $d
        shot() {
          name=$1; shift
          GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./09-water -frames 150 \
            -width 1280 -height 720 -time 0.35 -screenshot $d/$name.png "$@" >/dev/null 2>&1
        }
        shot alien -alien
        shot earth
        if [ ! -s $d/alien.png ] || [ ! -s $d/earth.png ]; then
          echo "MISSING CAPTURE -- this gate proves nothing"
          exit 1
        fi
        # The boxes, read off the capture at 1280x720 with -time 0.35. The
        # skyline in this pose sits at y 366; sky is clear dome above it, fog is
        # the far shore below it, and water is the first band of lake, where the
        # view is grazing enough that Fresnel is near one and the surface is
        # mostly the dome reflected. Cloud is the shaded underside of the large
        # cumulus left of centre, where the sun's own light has been
        # extinguished and the fill is most of what is left.
        go run ../cmd/palettecheck -a $d/alien.png -b $d/earth.png \
          -sky 200,346,200,18 -fog 200,370,200,16 -water 200,408,200,16 \
          -min 6 -tol 12 \
          -cloud 600,215,120,35 -cloudmin 12 -cloudtol 20 || status=1
        # A failure here is a picture -- whether the fog stayed Earth-blue or
        # merely moved less is the difference between a missing uniform and a
        # tuning question -- so keep the pair, the way `task lights` does.
        if [ $status -ne 0 ]; then
          echo "captures kept in examples/$d"
        else
          rm -rf $d
        fi
        exit $status

  volumetric:
    desc: "Check that a light's beam is in the air inside its cone and nowhere else"
    dir: examples
    cmds:
      # Needs a GPU, so it sits with smoke, validate, determinism, lights,
      # nightlight and waterlight rather than in `task ci`.
      #
      # This gate is one measurement, inverted. Issue #47's first proposal was
      # to radiate the existing screen-space god-ray pass from a lamp instead
      # of from the sun. Pointed at a doorway spotlight in this exact scene and
      # differenced against the same frame with the pass off, it added +21.3
      # mean luma to a box in the cone's path and +32.5 and +34.0 to boxes the
      # same distance from the bulb but straight up and to the side, where no
      # beam could be. The air a beam should fill gained two thirds of what the
      # air it must not fill gained, because that technique smears pixels that
      # are already bright and has no idea which way a light points. Every
      # arm below is that comparison the right way round, and a build that
      # produces a halo instead of a cone fails them the way the spike did.
      #
      # Differencing a pair is what makes any of it measurable: one frame
      # cannot say what should have been there. Both captures are the same
      # scene at the same fixed clock with only SpotLight.Volumetric changed,
      # so the night sky, the warm pools and the moonlit ground are identical
      # in both and subtract out.
      #
      # PROVED by breaking the committed code four ways, each restored
      # immediately after. What each one printed, verbatim:
      #
      # 1. The cone term dropped (`float spot = 1.0` in volumetric.inc's light
      #    loop), so the light scatters in every direction from the bulb --
      #    the halo the screen-space route produced. Every outside arm fires,
      #    and the sky arm's column stops being a column:
      #
      #      beam     +49.15  ok
      #      above    +36.45  FAIL: over the ceiling 0.50
      #      beside-r +20.88  FAIL: over the ceiling 0.50
      #      beside-l +56.09  FAIL: over the ceiling 0.50
      #      far      +19.69  FAIL: over the ceiling 0.00
      #      offscreen open +16.60 FAIL, far +10.56 FAIL
      #      sky column +15.04 against beside-l +14.62 and beside-r +14.80
      #
      #    That last line is the signature: a wash puts the same light on the
      #    beam and beside it. It is the #47 spike's failure exactly.
      #
      # 2. Only the first cell marched, never traversed
      #    (`resolveLightRange(px, nearDist * depthPerDist)`, so every sample
      #    walks slice 0's list wherever it actually is):
      #
      #      cone      SELF-CHECK: the two captures are pixel-identical
      #      control   -volumetric 1 and -volumetric 0 rendered the same bytes
      #
      #    Worth knowing, because it is not what was expected: `offscreen` and
      #    `sky` did NOT move, to the digit. In both of those poses the light's
      #    range sphere contains the camera, so it is in slice 0's list as well
      #    and "the first cell" happens to be the right list. The cone pose,
      #    where the camera looks past the lamp rather than standing under it,
      #    is the one that catches this -- which is an argument for keeping a
      #    pose of each shape rather than the one that reads highest.
      #
      # 3. The per-light intensity never reaching the GPU (volumetricIntensity
      #    in app.go returning 0), which also clears LightFlagVolumetric, so
      #    the march is skipped outright:
      #
      #      cone      SELF-CHECK: the two captures are pixel-identical
      #      offscreen SELF-CHECK: the two captures are pixel-identical
      #      sky       SELF-CHECK: the two captures are pixel-identical
      #      control   -volumetric 1 and -volumetric 0 rendered the same bytes
      #
      # 4. The sky path alone (sky.frag's volInscatter result multiplied by
      #    zero -- the state this feature was in before the sky pipeline got
      #    the light buffers). Only the sky arm fires, and the other two do not
      #    move at all:
      #
      #      cone beam      +14.30  ok  (unchanged)
      #      offscreen beam +16.70  ok  (unchanged)
      #      sky column      +0.00  FAIL: under the floor 1.50
      #
      #    Which is the point of having three poses: they fail separately.
      - |
        status=0
        d=.volumetric
        rm -rf $d && mkdir -p $d
        shot() {
          out=$1; shift
          GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./21-streetlights -frames 60 \
            -width 1280 -height 720 "$@" -screenshot $d/$out.png >/dev/null 2>&1
        }
        pair() {
          name=$1; shift
          shot $name-on  -volumetric 1 "$@"
          shot $name-off "$@"
          if [ ! -s $d/$name-on.png ] || [ ! -s $d/$name-off.png ]; then
            echo "$name: MISSING CAPTURE -- this gate proves nothing"
            status=1
            return 1
          fi
        }
        check() {
          name=$1; shift
          echo "-- $name"
          go run ../cmd/volumetriccheck -a $d/$name-on.png -b $d/$name-off.png "$@" || status=1
        }

        # ── the cone, seen from the side ──
        #
        # A door spot on the near building, its fixture at about (634,250) in
        # frame. The four boxes are placed AROUND that bulb deliberately: the
        # beam box 75 px below it, on the line between the bulb and the pool
        # its cone lands in, and the outside boxes 75 px above it and 105 px to
        # either side. Equidistant-ish and symmetric, because "more light in
        # the cone than out of it" is only worth stating if the boxes are not
        # chosen to flatter it.
        #
        # The ceilings are 0.50 and the arms read +0.00. They are not zero
        # because a ceiling that a rounding error trips is a gate people learn
        # to ignore, and `far` below is where the exact-zero claim is made.
        #
        # The beam box sits over TERRAIN, not over sky, and that is not an
        # accident. The first version of this arm used a box 75 px below the
        # bulb, which looked like the obvious place and turned out to be mostly
        # night sky -- so it was measuring sky.frag's march rather than
        # applyFog's, and those are different code in different shaders.
        # Breaking the sky path alone dropped it from +9.68 to +0.69 and the
        # arm fired, which is how that was found. A ground-backed box keeps
        # each arm on one path: this one and `offscreen` exercise the march
        # inside applyFog, and only `sky` exercises the sky's.
        pair cone -camtargetx 21 -camtargety 1.5 -camtargetz 0 \
          -camyaw 0 -campitch 0.1 -camdist 9 -camlook 0.6
        check cone \
          -region "beam:480,420,70,70:min=5.0" \
          -region "above:604,145,60,60:max=0.50" \
          -region "beside-r:704,220,60,60:max=0.50" \
          -region "beside-l:504,220,60,60:max=0.50" \
          -region "far:1100,640,60,60:max=0.00"

        # ── the bulb outside the frame ──
        #
        # The same building from closer and tilted down, so its fixture is off
        # the TOP of the frame while the cone it throws crosses the view. This
        # is the arm that separates the two routes: a screen-space smear needs
        # a bright pixel to smear and there is none, so it can produce nothing
        # here by construction, while the froxel walk neither knows nor cares
        # whether the light is on screen.
        #
        # The floor is 6.0 against a measured +16.7, and the box is over the
        # lit ground for the reason the cone arm's is. Loose on purpose: what
        # is asserted is "the beam is still there at all", and a tight floor on
        # a number this size would fail on a retune of the bulb rather than on
        # the thing this arm exists for.
        pair offscreen -camtargetx 21 -camtargety 0.9 -camtargetz 0 \
          -camyaw 0 -campitch 0.02 -camdist 6.5 -camlook -1.25
        check offscreen \
          -region "beam:600,230,60,60:min=6.0" \
          -region "open:900,500,60,60:max=0.50" \
          -region "far:400,620,80,80:max=0.00"

        # ── a beam against the night sky ──
        #
        # -skylamp puts a narrow spot in the middle of the plaza aimed straight
        # up; the camera stands level with the column 12 m away and 18 m up, so
        # the light itself is 54 degrees below the bottom edge and the column
        # runs vertically through the middle of the frame with nothing but sky
        # behind it.
        #
        # The sky is not a lit surface and does not go through applyFog at all.
        # It reaches the light buffers through a pipeline layout built for it
        # alone, so this is the one arm that can fail while every other one
        # passes -- and it did, before that layout existed: the first capture
        # of this feature showed a column that crossed the dark hills and
        # stopped dead at the skyline.
        pair sky -skylamp -camdist 12 -campitch 0 -camyaw 0.4 \
          -camtargetx 0 -camtargety 18 -camtargetz 0 -camlook 0
        check sky \
          -region "column:600,320,80,80:min=1.5" \
          -region "beside-l:200,320,80,80:max=0.50" \
          -region "beside-r:1000,320,80,80:max=0.50"

        # ── consecutive frames ──
        #
        # Nothing in this scene moves: the day cycle is stopped, the lamps are
        # a fixed slice and the march's jitter is a function of gl_FragCoord
        # and nothing else. So under a fixed clock frame N and frame N+1 must
        # be the same bytes, and if they are not, something in the march is a
        # function of the frame -- a uniform that moved, a buffer read while
        # another frame wrote it. That is invisible in a still and obvious to
        # anyone watching the window, which is the worst combination a gate can
        # leave.
        #
        # `task determinism` runs two whole runs against each other and would
        # not see it: a cause that repeats run to run repeats identically.
        shot consec-a -volumetric 1 -skylamp
        GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./21-streetlights -frames 61 \
          -width 1280 -height 720 -volumetric 1 -skylamp \
          -screenshot $d/consec-b.png >/dev/null 2>&1
        if [ ! -s $d/consec-a.png ] || [ ! -s $d/consec-b.png ]; then
          echo "-- consecutive frames: MISSING CAPTURE -- this gate proves nothing"
          status=1
        elif diff -q $d/consec-a.png $d/consec-b.png >/dev/null 2>&1; then
          echo "-- consecutive frames: frame 60 and frame 61 are identical, as a still scene must be"
        else
          echo "-- consecutive frames: FRAME 60 AND FRAME 61 DIFFER -- the march is a function of the frame"
          status=1
        fi

        # Prove the comparison can say no, the way `task lights` does. The
        # volumetrics-on capture of the cone pose must differ from the
        # volumetrics-off one somewhere; volumetriccheck asserts that itself,
        # but only on the pairs it is handed, and this says it once in the
        # gate's own voice.
        if diff -q $d/cone-on.png $d/cone-off.png >/dev/null 2>&1; then
          echo "control: -volumetric 1 and -volumetric 0 rendered the same bytes -- this gate proves nothing"
          status=1
        else
          echo "control: asking for volumetrics changes the capture, as it must"
        fi

        # A failure here is a picture. Keep the pair that failed, the way
        # `task lights` does: whether the light is in the wrong place or simply
        # absent is not something the numbers say on their own.
        if [ $status -ne 0 ]; then
          echo "captures kept in examples/$d"
        else
          rm -rf $d
        fi
        exit $status

  bench:
    desc: Run the benchmark scenes and print CPU/GPU cost per pass
    cmds:
      # Needs a GPU. Timings come from GPU timestamp queries and the engine's own
      # per-phase CPU timer, so this does not need vsync off -- which is the
      # point, since the old way of benchmarking pegged the card audibly.
      #
      # No committed baseline to compare against: frame cost depends on the GPU,
      # the driver, the display mode and what else is running, so a stored number
      # would be from someone else's machine. Run it before and after a change.
      - go run ./cmd/bench {{.CLI_ARGS}}

  check:self-test:
    desc: Verify startup classification, one retry, and validation failure handling
    cmds:
      - . tools/check-example-test.sh

  ci:
    desc: Run everything CI runs
    cmds:
      - task: check:self-test
      - task: lint
      - task: build
      - task: test
      - task: test:race

  clean:
    desc: Remove build output
    cmds:
      - rm -rf dist .task
