version: "3"

vars:
  EXE: '{{if eq OS "windows"}}.exe{{end}}'
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

env:
  CGO_ENABLED: "1"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # ───────────────────────── examples ─────────────────────────

  examples:
    desc: List the runnable examples
    dir: examples
    cmds:
      - 'echo "Runnable examples (task example:<name>):"'
      - 'ls -d [0-9]*/ | sed "s#/##" | sed "s/^/  /"'
    silent: true

  "example:*":
    desc: "Run one example, e.g. task example:01-triangle"
    vars:
      NAME: '{{index .MATCH 0}}'
    dir: 'examples/{{.NAME}}'
    cmds:
      - go run . {{.CLI_ARGS}}

  # ───────────────────────── shaders ─────────────────────────
  # .spv files are COMMITTED on purpose: shaders/shaders.go embeds them with
  # go:embed, so without them the module will not build for anyone who runs
  # `go get`. glslc is therefore only needed when editing GLSL.

  shaders:
    desc: Compile GLSL to SPIR-V (requires VULKAN_SDK; only needed when editing shaders)
    dir: shaders
    cmds:
      - for f in *.vert *.frag; do "${VULKAN_SDK}/bin/glslc{{.EXE}}" "$f" -o "$f.spv"; done
    sources:
      - shaders/*.vert
      - shaders/*.frag
      - shaders/*.inc
    generates:
      - shaders/*.spv

  shaders:verify:
    desc: Assert the committed .spv match their GLSL (needs VULKAN_SDK)
    cmds:
      # The check itself lives in a Go test so it runs under `task ci` and in
      # CI without depending on which shell or coreutils are present. This is
      # just a named entry point for it.
      - go test ./shaders/ -run TestCommittedSPIRVMatchesGLSL -count=1 -v

  # ───────────────────────── fonts ─────────────────────────

  font:
    desc: Regenerate the MSDF font atlas for example 10-text
    cmds:
      # cmd/msdfatlas is pure Go, so this needs no C++ toolchain and no
      # msdf-atlas-gen install -- that is the point of having it in-tree.
      # -range 8 rather than the default 4: the example renders down to 13px,
      # and a glyph needs at least ~2 screen pixels of distance field to
      # resolve its edge. See the note on Options.Range.
      - >-
        go run ./cmd/msdfatlas
        -builtin -range 8 -out examples/10-text/assets/fonts/goregular
      - >-
        go run ./cmd/msdfatlas
        -builtin -range 8 -out examples/15-kitchen-sink/assets/fonts/goregular
      - >-
        go run ./cmd/msdfatlas
        -builtin -range 8 -out examples/13-ui/assets/fonts/goregular
    sources:
      - msdf/*.go
      - cmd/msdfatlas/*.go
    generates:
      - examples/10-text/assets/fonts/goregular.png
      - examples/10-text/assets/fonts/goregular.json
      - examples/15-kitchen-sink/assets/fonts/goregular.png
      - examples/15-kitchen-sink/assets/fonts/goregular.json

  # ───────────────────────── quality ─────────────────────────

  build:
    desc: Build the engine and all examples
    cmds:
      - go build ./...
      - go build -C examples ./...

  test:
    desc: Run all tests
    cmds:
      - go test ./... -count=1

  test:race:
    desc: Run tests under the race detector (the parallel movement phase needs it)
    cmds:
      - go test -race ./... -count=1

  fmt:
    desc: Format all Go code
    cmds:
      - gofmt -w .

  lint:
    desc: Check formatting, then vet
    cmds:
      # -unsafeptr=false: window.go bridges a GLFW surface handle through
      # unsafe.Pointer on purpose, and the check has no way to know that.
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "Not gofmt'd:"
          echo "$unformatted"
          exit 1
        fi
      - go vet -unsafeptr=false ./...
      # -C must be the first flag on the command line.
      - go vet -C examples -unsafeptr=false ./...

  smoke:
    desc: "Headless-ish smoke test: render a fixed number of frames of every example and exit"
    dir: examples
    cmds:
      # A non-zero exit from any of these means the Vulkan path broke. Frame
      # counts are small on purpose -- this checks that pipelines build and
      # frames present, not that the image looks right.
      - go run ./01-triangle -frames 60
      - go run ./02-cube -frames 60
      - go run ./03-physics -frames 60
      - go run ./04-first-person -frames 60
      - go run ./05-textures -frames 60
      - go run ./06-skinned -frames 60
      - go run ./08-grass -frames 60
      - go run ./07-terrain -frames 60
      - go run ./09-water -frames 60
      - go run ./11-lights -frames 60
      - go run ./12-particles -frames 60
      - go run ./13-ui -frames 60
      - go run ./10-text -frames 60
      - go run ./16-materials -frames 60
      - go run ./17-input -frames 60
      - go run ./18-translucent -frames 60
      - go run ./19-instanced -frames 60
      - go run ./20-screens -frames 60
      - go run ./21-streetlights -frames 60
      - go run ./15-kitchen-sink -demo -frames 60

  validate:
    desc: "Run every example under the Vulkan validation layer; fails on leaked objects"
    dir: examples
    env:
      GLYPHENGINE_VALIDATION: "1"
    cmds:
      # Requires a GPU and the Vulkan SDK, so this is deliberately not part of
      # `task ci`.
      #
      # Every example is expected to run completely silent under the layer, so
      # this fails on ANY validation message -- not just leaks. That is a
      # strict gate on purpose: Vulkan misuse is usually invisible until it
      # corrupts a frame on hardware you do not own, and the only cheap signal
      # is "the layer said something". Leaked objects are reported separately
      # because they surface at vkDestroyDevice rather than during rendering.
      - |
        status=0
        # The count below comes from grep, and a shell without one returns an
        # empty string: [ "" -ne 0 ] is an error, the else branch runs, and
        # every example reads "clean" with the layer screaming. That is how
        # task determinism compared nothing for weeks on a shell with no
        # sha256sum. So the counter is shown one message and must count it.
        probe=$(echo "VULKAN ERROR: self-check" | grep -cE "VULKAN (ERROR|WARNING)" || true)
        if [ "$probe" != "1" ]; then echo "SELF-CHECK: cannot count validation messages here (grep missing?) -- this gate proves nothing"; exit 1; fi
        check() {
          ex=$1; shift
          label=$ex
          if [ $# -gt 0 ]; then label="$ex $*"; fi
          out=$(go run ./$ex -frames 30 "$@" 2>&1) || { echo "$label: FAILED TO RUN"; echo "$out"; status=1; return; }
          msgs=$(echo "$out" | grep -cE "VULKAN (ERROR|WARNING)" || true)
          leaks=$(echo "$out" | grep -c "has not been destroyed" || true)
          if [ "$msgs" -ne 0 ]; then
            echo "$label: $msgs validation message(s), $leaks of them leaked objects"
            echo "$out" | grep -E "VULKAN (ERROR|WARNING)" | head -20
            status=1
          else
            echo "$label: clean"
          fi
        }
        for ex in 01-triangle 02-cube 03-physics 04-first-person 05-textures 06-skinned 07-terrain 08-grass 09-water 10-text 11-lights 12-particles 13-ui 16-materials 17-input 18-translucent 19-instanced 20-screens 21-streetlights 15-kitchen-sink; do
          check $ex
        done
        # Render paths no example turns on by default. Everything above runs
        # with stock settings, so an opt-in path can rot for months with every
        # gate green -- the layer only ever sees the code that actually runs.
        check 08-grass -grassimpostor 25
        # The blended skinned pipeline. No default run reaches it: 06-skinned's
        # character carries a generated normal map, which routes it through the
        # skinned material pipeline instead.
        check 06-skinned -demo -plain -fade 0.4
        # 21-streetlights' non-default paths: the moving sweep, the cleared
        # spotlight set, a lamp count well past the default, and the debug
        # heatmap. None of these run under stock settings above.
        check 21-streetlights -sweep
        check 21-streetlights -off
        check 21-streetlights -lamps 300
        check 21-streetlights -lightdebug heatmap
        # The night grade setter. Strength 0 takes atmNightShift's early-out
        # and a custom tint takes the other branch, so between them the two
        # cover both sides of it with a uniform the layer can object to.
        check 21-streetlights -nightshift 0
        check 21-streetlights -nighttint 1.30,0.86,0.72
        # Blended draws on both sides of the water surface. This is the one run
        # that records the translucent, particle and overlay pipelines inside
        # the WATER render pass, which no stock run reaches -- and render pass
        # compatibility is exactly the kind of thing only the layer sees. It
        # caught the first version of it on frame one, with a subpass
        # dependency mismatch the attachments gave no hint of. See
        # sceneEntryDependency.
        check 09-water -plume -ghost -marker -submerged
        exit $status

  sky:
    desc: "Check that celestial bodies are occluded by the terrain in front of them"
    dir: examples
    cmds:
      # Needs a GPU, so it sits with smoke, validate and determinism rather than
      # in `task ci`.
      #
      # The sun and moon draw after the sky, so clouds can cover them. What they
      # must still be is depth tested: geometry writes alpha 1.0, so the sky's
      # alpha cannot mask them against terrain and never could. Without the
      # depth test a sun that has set draws on top of the hills it set behind.
      #
      # This camera puts the setting sun squarely behind a headland. Nothing in
      # the lower two thirds should be brighter than the dark terrain there, and
      # the disc is pale yellow against nearly black, so the margin is enormous.
      #
      # -shafts 0 changes nothing today and is here for the day it does. An
      # earlier version of this comment said the shaft pass "samples the scene
      # and would react to the disc", and the fix's commit message blamed a
      # 32 % frame difference on it. Both were wrong: the god-ray pipeline is
      # built and never drawn (#50), and -shafts 0, 1 and 3 render byte-identical
      # frames. The flag stays so that wiring shafts up cannot quietly turn this
      # from a test of the disc into a test of the disc plus a radial blur.
      - |
        status=0
        d=.sky
        rm -rf $d && mkdir -p $d
        GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./09-water -frames 60           -time 0.77 -pitch 0.18 -yaw 2.4 -clouds 0 -stars 0 -band 0 -shafts 0           -screenshot $d/sun.png >/dev/null 2>&1
        if [ ! -s $d/sun.png ]; then
          echo "MISSING CAPTURE -- this gate proves nothing"
          exit 1
        fi
        go run ../cmd/skycheck -in $d/sun.png -y0 240 -max 120 || status=1
        rm -rf $d
        exit $status

  determinism:
    desc: "Check that a fixed frame clock makes renders, and the draw sequence behind them, identical"
    dir: examples
    cmds:
      # Needs a GPU, so it sits with smoke and validate rather than in `task ci`.
      #
      # The scenes here are the ones that move on their own: wind and clouds,
      # water, particle spawns, animation sampling. A still scene would pass
      # this without proving anything.
      # The output paths are relative on purpose: the examples resolve them
      # against their own working directory, and a Windows Go binary cannot
      # open the POSIX path mktemp hands back.
      - |
        status=0
        d=.determinism
        rm -rf $d && mkdir -p $d
        shot() { GLYPHENGINE_FIXED_FRAME_TIME=$1 go run ./$2 -frames 90 $4 -screenshot $d/$3.png >/dev/null 2>&1; }
        same() {
          [ -s "$d/$1.png" ] && [ -s "$d/$2.png" ] || { echo "MISSING CAPTURE -- this gate proves nothing"; status=1; return 1; }
          diff -q "$d/$1.png" "$d/$2.png" >/dev/null 2>&1
        }
        # The same comparison over two named files rather than two captures,
        # for the draw-sequence gate below. Same rule: an empty file is a
        # missing measurement, not a match.
        samefile() {
          [ -s "$1" ] && [ -s "$2" ] || { echo "MISSING EXTRACT -- this gate proves nothing"; status=1; return 1; }
          diff -q "$1" "$2" >/dev/null 2>&1
        }
        # Prove the comparator before trusting a word it says.
        #
        # This used to hash with sha256sum, which is not on the PATH of the
        # shell task runs on Windows. Both hashes came back empty, every pair
        # compared equal, and the gate printed a column of "identical" that
        # meant nothing -- the failure only surfaced at the very end, on the
        # control. A comparator is a check like any other and gets checked
        # first. diff is what sh can be relied on to have; if it is missing too
        # it reports every pair as different, which fails loudly instead.
        printf a > $d/x.png; printf a > $d/y.png
        same x y || { echo "SELF-CHECK: two identical files compared unequal -- this gate proves nothing"; exit 1; }
        printf b > $d/y.png
        if same x y; then
          echo "SELF-CHECK: two different files compared equal -- this gate proves nothing"
          exit 1
        fi
        printf "loop=1 draws=1/aa" > $d/x.seq; printf "loop=1 draws=1/aa" > $d/y.seq
        samefile $d/x.seq $d/y.seq || { echo "SELF-CHECK: two identical extracts compared unequal -- this gate proves nothing"; exit 1; }
        printf "loop=1 draws=1/bb" > $d/y.seq
        if samefile $d/x.seq $d/y.seq; then
          echo "SELF-CHECK: two different extracts compared equal -- this gate proves nothing"
          exit 1
        fi
        # And the extractor: a trace with no draws= on any line must be an
        # error, not an empty file that compares equal to another empty file.
        # That is the exact shape the sha256sum failure had.
        if go run ../cmd/tracefield -key notafield -in $d/x.seq -out $d/z.seq >/dev/null 2>&1; then
          echo "SELF-CHECK: tracefield accepted a field that is not there -- this gate proves nothing"
          exit 1
        fi
        rm -f $d/x.png $d/y.png $d/x.seq $d/y.seq $d/z.seq
        # The water/blended split is in here because it reorders a buffer every
        # frame from the camera's position: a partition that was not stable, or
        # that read a stale upload, would show up as two runs disagreeing long
        # before anyone noticed it in a picture.
        #
        # 08-grass is rendered at night as well as at its default 0.28. Issue
        # #40 was a night capture, and the gate rendering only 0.28 is named in
        # the issue as the reason it went unseen: at night the sky is dim
        # enough that the grass silhouette is most of what the image is, so a
        # difference lands somewhere the daytime frame hides it.
        for ex in "08-grass" "08-grass -timeofday 0.0" "08-grass -timeofday 0.03" "09-water" "12-particles" "06-skinned -demo" "15-kitchen-sink -demo" "09-water -plume -ghost -marker -submerged"; do
          set -- $ex
          name=$1; shift
          shot 16.667ms $name a "$*"
          shot 16.667ms $name b "$*"
          if same a b; then
            echo "$name $*: identical"
          elif [ $? -eq 1 ] && [ -s $d/a.png ]; then
            echo "$name $*: TWO RUNS DIFFER under a fixed clock"
            status=1
          fi
        done

        # Two runs matching only says the machine behaved the same way twice.
        # What a fixed clock is supposed to buy is that the capture is a
        # function of the simulation and of nothing else -- and it was not: it
        # was also a function of how many frames the window system made the
        # renderer drop, and when. That arrives while a window is being shown,
        # when it moves between monitors, when the compositor changes mode, so
        # waiting for it is not a test. The GLYPHENGINE_PROVOKE_* variables put
        # one on a frame we name; see docs/agents/state-trace.md.
        #
        # Measured on this repo before the fixes, against the quiet capture of
        # the same build (1280x720, fixed clock):
        #
        #   rebuild after 08-grass frame 149     257601 px (27.95 %), max delta 104
        #   rebuild after 09-water frame 89      234723 px (25.47 %), max delta 114
        #   frame 149 of 08-grass never drawn     12986 px (1.41 %),  max delta 2
        #   frame 88 of 12-particles never drawn   9899 px (1.07 %),  max delta 2
        #   20 frames x 40ms of stall                 no change
        #   draw list reversed before the sort        no change
        #
        # The last two have never failed and are here as the other half of the
        # statement: a wall-clock stall must not reach the image, and neither
        # must the order an ECS query happens to walk its map in. The draw list
        # arrives in a different order on every frame of every run already --
        # the state trace shows draws= differing while drawsset= matches -- so
        # this is the check that keeps that latent.
        prov() {
          label=$1; var=$2; val=$3; name=$4; frames=$5; shift 5
          GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./$name -frames $frames $* -screenshot $d/q.png >/dev/null 2>&1
          # A subshell so the provocation cannot leak into the next pair; the
          # name is only known at runtime, so it is exported rather than
          # written as an assignment prefix.
          ( export "$var=$val"; GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./$name -frames $frames $* -screenshot $d/r.png >/dev/null 2>&1 )
          if same q r; then
            echo "$label: capture unchanged, as it must be"
          elif [ $? -eq 1 ] && [ -s $d/q.png ]; then
            echo "$label: THE CAPTURE CHANGED -- the picture depends on more than the simulation"
            status=1
          fi
        }
        prov "rebuild on the last frame"   GLYPHENGINE_PROVOKE_RECREATE_FRAMES 149        08-grass     150 -timeofday 0.28
        prov "rebuild mid-run"             GLYPHENGINE_PROVOKE_RECREATE_FRAMES 89         09-water      90
        # A moving camera, because every case above holds the camera still and
        # a still camera cannot tell a fresh reprojection matrix from a stale
        # one: prevVP equals the current VP on every frame. Leaving prevVP
        # unadvanced on the frame that triggers a rebuild passed all six other
        # cases and changes this capture at rebuild frames 60 and 89 alike.
        prov "rebuild under a moving camera" GLYPHENGINE_PROVOKE_RECREATE_FRAMES 60      15-kitchen-sink 90 -demo
        prov "a frame never drawn"         GLYPHENGINE_PROVOKE_SKIP_FRAMES     149        08-grass     150 -timeofday 0.0
        prov "frames never drawn"          GLYPHENGINE_PROVOKE_SKIP_FRAMES     3,40,88    12-particles  90
        prov "a stalled cold start"        GLYPHENGINE_PROVOKE_STALL           20:40ms    08-grass     150 -timeofday 0.0
        prov "draw list reversed"          GLYPHENGINE_PROVOKE_DRAW_ORDER      reverse    09-water      90 -plume -ghost -marker -submerged

        # The SEQUENCE the recorder was handed, not just the picture it made.
        #
        # Everything above compares captures, and a capture cannot see an
        # ordering bug that has not reached the image yet. This one did not:
        # the draw list arrives from a Go map walk, it was sorted with an
        # unstable sort, and the sort key's low bits were a descriptor set
        # ADDRESS -- so the recorded order was different in every process, and
        # `draws=` in the state trace differed between two runs of eight of the
        # thirteen scenes below while `drawsset=` and the PNG matched. Issue
        # #53. Nothing rendered wrong; the next scene with two equal-depth
        # blended draws would have flickered, and no capture gate would have
        # said why.
        #
        # So the assertion is on the trace field directly. cmd/tracefield pulls
        # `draws=` out and diff compares the two -- diff and not a hash, for the
        # reason written at the top of this gate. The whole trace cannot be
        # diffed: `slot=` and `image=` name the frame-in-flight and the
        # swapchain image the acquire returned, and both legitimately differ
        # between two runs that drew the same frame.
        #
        # Measured before the fix, two runs each, 90 frames (lines of 90 whose
        # draws= differed): 09-water 19, 12-particles 61, 06-skinned 90,
        # 09-water -plume... 33, 18-translucent 90, 13-ui 24, 10-text 13,
        # 21-streetlights 90. The three 08-grass poses, 15-kitchen-sink and
        # 19-instanced happened to match on that run, which is what "randomised"
        # means -- it is not a property of the scene.
        #
        # And verified by breaking the fix: with sortDraws' final tiebreak
        # replaced by `return 0`, this reports 18-translucent, 21-streetlights
        # and 12-particles as differing on all 90 lines and exits 1.
        drawseq() {
          set -- $1
          name=$1; shift
          GLYPHENGINE_FIXED_FRAME_TIME=16.667ms GLYPHENGINE_STATE_TRACE=$d/s1.trace go run ./$name -frames 90 $* >/dev/null 2>&1
          GLYPHENGINE_FIXED_FRAME_TIME=16.667ms GLYPHENGINE_STATE_TRACE=$d/s2.trace go run ./$name -frames 90 $* >/dev/null 2>&1
          go run ../cmd/tracefield -key draws -in $d/s1.trace -out $d/s1.draws || { status=1; return; }
          go run ../cmd/tracefield -key draws -in $d/s2.trace -out $d/s2.draws || { status=1; return; }
          if samefile $d/s1.draws $d/s2.draws; then
            echo "$name $*: draw sequence identical"
          else
            echo "$name $*: THE DRAW SEQUENCE DIFFERS between two runs"
            diff $d/s1.draws $d/s2.draws | head -6
            status=1
          fi
        }
        for ex in "08-grass" "08-grass -timeofday 0.0" "08-grass -timeofday 0.03" "09-water"                   "12-particles" "06-skinned -demo" "15-kitchen-sink -demo"                   "09-water -plume -ghost -marker -submerged"                   "18-translucent" "13-ui" "10-text" "19-instanced" "21-streetlights"; do
          drawseq "$ex"
        done
        # Prove this comparison can say no on real traces and not only on the
        # constructed files above. Without the fixed clock the model matrices
        # the hash covers are sampled at different times, so two runs of an
        # animated scene must disagree; if they do not, the traces are not
        # being read.
        GLYPHENGINE_STATE_TRACE=$d/c1.trace go run ./12-particles -frames 90 >/dev/null 2>&1
        GLYPHENGINE_STATE_TRACE=$d/c2.trace go run ./12-particles -frames 90 >/dev/null 2>&1
        go run ../cmd/tracefield -key draws -in $d/c1.trace -out $d/c1.draws || status=1
        go run ../cmd/tracefield -key draws -in $d/c2.trace -out $d/c2.draws || status=1
        if samefile $d/c1.draws $d/c2.draws; then
          echo "control: draw sequences matched WITHOUT a fixed clock -- this gate proves nothing"
          status=1
        else
          echo "control: the draw sequence differs without the fixed clock, as it must"
        fi
        # A paused world must be frozen, not merely slowed. 09-water is the
        # scene for it because the things that move there run off different
        # clocks: the waves and shoreline foam off the elapsed clock the shaders
        # read, the sun off Scene.Tick. Two captures taken 60 frames apart after
        # the pause are identical only if SetTimeScale stopped all of them.
        GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./09-water -frames 60 -pauseat 30 -screenshot $d/p1.png >/dev/null 2>&1
        GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./09-water -frames 120 -pauseat 30 -screenshot $d/p2.png >/dev/null 2>&1
        if same p1 p2; then
          echo "pause: world frozen, as it must be"
        else
          echo "pause: THE WORLD KEPT MOVING WHILE PAUSED"
          status=1
        fi

        # Prove the check is not vacuous: with the real clock the same two runs
        # must NOT match, or it is passing on a scene that never moves -- or on
        # captures that were never written.
        go run ./08-grass -frames 90 -screenshot $d/c.png >/dev/null 2>&1
        go run ./08-grass -frames 90 -screenshot $d/e.png >/dev/null 2>&1
        if same c e; then
          echo "control: 08-grass matched WITHOUT a fixed clock -- this gate proves nothing"
          status=1
        else
          echo "control: differs without the fixed clock, as it must"
        fi
        rm -rf $d
        exit $status

  screenshots:
    desc: Regenerate the documentation images in docs/images
    dir: examples
    env:
      # A fixed clock makes these reproducible: the same commit regenerates the
      # same bytes, so a diff in docs/images means the renderer changed rather
      # than that the wind was somewhere else. See WithFixedFrameTime.
      GLYPHENGINE_FIXED_FRAME_TIME: 16.667ms
    cmds:
      - go run ./01-triangle -frames 30 -screenshot ../docs/images/01-triangle.png
      - go run ./02-cube -frames 150 -screenshot ../docs/images/02-cube.png
      - go run ./03-physics -frames 150 -screenshot ../docs/images/03-physics.png
      - go run ./05-textures -frames 90 -screenshot ../docs/images/05-textures.png
      - go run ./06-skinned -demo -frames 200 -screenshot ../docs/images/06-skinned.png
      - go run ./07-terrain -frames 150 -screenshot ../docs/images/07-terrain.png
      - go run ./08-grass -frames 150 -screenshot ../docs/images/08-grass.png
      - go run ./09-water -frames 150 -screenshot ../docs/images/09-water.png
      - go run ./11-lights -frames 90 -screenshot ../docs/images/11-lights.png
      - go run ./12-particles -frames 150 -screenshot ../docs/images/12-particles.png
      - go run ./13-ui -frames 90 -screenshot ../docs/images/13-ui.png
      - go run ./10-text -frames 90 -screenshot ../docs/images/10-text.png
      - go run ./16-materials -frames 150 -screenshot ../docs/images/16-materials.png
      - go run ./17-input -frames 60 -screenshot ../docs/images/17-input.png
      - go run ./18-translucent -frames 120 -screenshot ../docs/images/18-translucent.png
      - go run ./19-instanced -frames 60 -screenshot ../docs/images/19-instanced.png
      - go run ./20-screens -frames 60 -screenshot ../docs/images/20-screens.png
      - go run ./21-streetlights -frames 90 -screenshot ../docs/images/21-streetlights.png
      - go run ./15-kitchen-sink -demo -frames 260 -screenshot ../docs/images/15-kitchen-sink.png

  hud:
    desc: "Check that screen-space overlays survive the post-process chain"
    dir: examples
    cmds:
      # Needs a GPU, so it sits with smoke, validate and determinism rather
      # than in `task ci`.
      #
      # 09-water is the scene that catches this, because the failure needs both
      # water and text in the same frame -- which is why neither `task smoke`
      # nor `task validate` ever saw it. Overlays used to be recorded in the
      # scene pass, so the HUD sat in the HDR image that water copies to refract
      # through: the surface drew over text that writes no depth, and what came
      # back was five lines missing outright and four more warped along the
      # waves.
      #
      # -hud draws the same string on every line. Identical lines are the whole
      # trick: a line over bright sky and a line over dark water are the same
      # draw, so any difference in what survives between them is the renderer's,
      # and hudcheck recovers per-line glyph coverage by differencing against the
      # same frame with the HUD off. See cmd/hudcheck for the arithmetic.
      - |
        status=0
        d=.hud
        rm -rf $d && mkdir -p $d
        shot() { GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./09-water -frames 90 -hud $1 -screenshot $d/$2.png $3 >/dev/null 2>&1; }
        pair() {
          name=$1; shift
          shot 26 $name-hud "$*"
          shot 0  $name-bare "$*"
          if [ ! -s "$d/$name-hud.png" ] || [ ! -s "$d/$name-bare.png" ]; then
            echo "$name: MISSING CAPTURE -- this gate proves nothing"
            status=1
            return
          fi
          echo "── $name ──"
          go run ../cmd/hudcheck -a $d/$name-hud.png -b $d/$name-bare.png -lines 26 || status=1
        }
        # Stock scene: the text block crosses the waterline, which is the
        # failure as reported.
        pair water
        # Bloom low enough that white text clears the threshold, and the camera
        # pitched down so the sky does not blow out behind the text and take the
        # measurement with it. This is the run that exercises the second half:
        # overlays inside the scene target fed the bloom chain, so the HUD glowed
        # into the frame around it. Before the move this pair reported 25 of 26
        # lines lost and 74268 scene pixels perturbed.
        pair bloom -pitch 0.45 -bloom 0.7 -bloomthreshold 0.5
        rm -rf $d
        exit $status

  lights:
    desc: "Check that clustered lighting renders exactly what brute force does"
    dir: examples
    cmds:
      # Needs a GPU, so it sits with smoke, validate and determinism rather
      # than in `task ci`.
      #
      # Why exact equality is the right bar, rather than a tolerance: both
      # modes run the same shader over the same uploaded light array in the
      # same relative order, and a light that does not reach a fragment adds
      # exactly +0.0 to that fragment's sum. Clustering can only change which
      # lights a fragment skips, so if it skips only lights that contribute
      # nothing the bytes are identical. Any difference is therefore a light
      # missing from a froxel it belongs in, and it will be tile-shaped --
      # which is also why a tolerance would be the wrong instrument: a lost
      # light is a few percent of one tile's brightness, and any threshold
      # loose enough to absorb "noise" absorbs that too.
      #
      # The scene is 400 dim lamps of range 4 on a 1.6 m grid plus 32 spots.
      # The ring the example lights by default would not do: every one of its
      # lights reaches most of the scene, so every froxel lists all of them
      # and the two modes would agree even with the binner deleted.
      #
      # The near pose is the one that matters. -camdist 0.8 puts the eye half
      # a metre up with the floor 0.6 m away, inside about forty lamp spheres:
      # lights whose screen bound does not exist, fragments in the first depth
      # slice, and a camera the consumer game's players spend their time in.
      # 40 unbounded lights and 21 screen-wide ones, against 8 and 0 from the
      # overview pose.
      #
      # PROVED: with the sphere test in lightcluster's Builder.bin shrunk to
      # 0.8*radius -- a binner that is fast, plausible and not conservative --
      # all four pose/resolution pairs report CLUSTERED AND BRUTE FORCE
      # DIFFER. Restored immediately after.
      #
      # What that failure looks like is the argument for comparing bytes.
      # Measured on the kept captures at 1920x1080: the near pose differs on
      # 25.8% of its pixels and the overview on 0.36%, and in both the largest
      # channel difference anywhere is ONE of 255. The lights a shrunk sphere
      # loses are the ones whose range barely reaches the froxel, so what goes
      # missing is the dim tail of a falloff, not a tile of black -- almost
      # invisible to the eye and to any RMS threshold, on a binner that is
      # genuinely wrong. An exact comparison is the only instrument that
      # reports it, and it is free.
      - |
        status=0
        d=.lights
        rm -rf $d && mkdir -p $d
        shot() {
          mode=$1; out=$2; w=$3; h=$4; shift 4
          GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./11-lights -frames 60 \
            -width $w -height $h -lightdebug "$mode" "$@" \
            -screenshot $d/$out.png >/dev/null 2>&1
        }
        # A missing capture returns 2, not 1, so "the run died" cannot be read
        # as "the images match". Every call site is an `if`, because the task
        # runner's shell exits on the first failing command otherwise -- which
        # would report the first bad pose and never look at the other three.
        # diff rather than sha256sum, which the shell task runs on Windows does
        # not have: both hashes came back empty, every pair compared equal, and
        # the gate printed a column of "identical" while comparing nothing.
        # Proved below before any capture is judged, the same way `task
        # determinism` does it.
        same() {
          [ -s "$d/$1.png" ] && [ -s "$d/$2.png" ] || return 2
          diff -q "$d/$1.png" "$d/$2.png" >/dev/null 2>&1
        }
        printf a > $d/selfa.png; printf a > $d/selfb.png
        same selfa selfb || { echo "SELF-CHECK: two identical files compared unequal -- this gate proves nothing"; exit 1; }
        printf b > $d/selfb.png
        if same selfa selfb; then
          echo "SELF-CHECK: two different files compared equal -- this gate proves nothing"
          exit 1
        fi
        rm -f $d/selfa.png $d/selfb.png
        pair() {
          name=$1; w=$2; h=$3; shift 3
          shot ""           $name-clustered $w $h -lamps 400 -spots 32 "$@"
          shot bruteforce   $name-brute     $w $h -lamps 400 -spots 32 "$@"
          if same $name-clustered $name-brute; then
            echo "$name ${w}x${h}: identical"
          elif [ $? -eq 1 ]; then
            echo "$name ${w}x${h}: CLUSTERED AND BRUTE FORCE DIFFER"
            status=1
          else
            echo "$name ${w}x${h}: MISSING CAPTURE -- this gate proves nothing"
            status=1
          fi
        }
        pair overview 1280 720
        pair overview 1920 1080
        pair near 1280 720  -camdist 0.8 -campitch 0.6 -camtarget 0.05 -camlook 0
        pair near 1920 1080 -camdist 0.8 -campitch 0.6 -camtarget 0.05 -camlook 0
        # 21-streetlights is the other scene that places lights, and a
        # different shape of one: six cones thrown down walls onto terrain
        # plus a ring of lamps, rather than a floor of hundreds of spheres.
        # Cones are the part 11-lights' grid does not exercise the same way --
        # a spot's bound is its range sphere, so every froxel a cone misses
        # inside that sphere is a light the shader has to reject rather than
        # one the binner dropped -- and -lamps 300 packs the ring tightly
        # enough that cells hold both kinds at once.
        sshot() {
          mode=$1; out=$2; shift 2
          GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./21-streetlights -frames 60 \
            -width 1280 -height 720 -lightdebug "$mode" "$@" \
            -screenshot $d/$out.png >/dev/null 2>&1
        }
        spair() {
          name=$1; shift
          sshot ""           street-$name-clustered "$@"
          sshot bruteforce   street-$name-brute     "$@"
          if same street-$name-clustered street-$name-brute; then
            echo "21-streetlights $name: identical"
          elif [ $? -eq 1 ]; then
            echo "21-streetlights $name: CLUSTERED AND BRUTE FORCE DIFFER"
            status=1
          else
            echo "21-streetlights $name: MISSING CAPTURE -- this gate proves nothing"
            status=1
          fi
        }
        spair default
        spair lamps300 -lamps 300
        # The two modes are only required to agree while nothing is being
        # dropped. A cell over its light cap, a spent index buffer or a light
        # over the frame budget all make clustered differ from brute force for
        # a reason that is not a binning bug -- so if the scene ever grows
        # into one of them, say that instead of blaming the binner. The
        # denser overview pose is the one that would hit it first: it peaks at
        # 67 lights in a cell against the near pose's 36, of a cap of 128.
        # Checked against a scene that does drop lights (-count 1024, which
        # overflows 1956 cells and drops 30 over budget): the case below
        # rejects it.
        # grep and a parameter expansion rather than sed, which the shell task
        # runs on Windows does not have either -- and a missing sed took the
        # whole gate down with exit 127 after it had already printed six
        # meaningless "identical" lines.
        raw=$(GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./11-lights -frames 30 \
          -lamps 400 -spots 32 -lightstats 2>&1 | grep 'light stats: ')
        stats=${raw##*light stats: }
        echo "binner: $stats"
        case "$stats" in
          *DroppedOverBudget:0\ *CellsOverflowed:0\ *CellsTruncated:0\ *) ;;
          *) echo "the scene drops lights before the comparison starts -- it is not a clean oracle"
             status=1 ;;
        esac
        # Prove the comparison can say no. One lamp fewer, everything else the
        # same: if these match, the captures are not of the scene that was
        # asked for and every "identical" above means nothing.
        shot "" control-400 1280 720 -lamps 400 -spots 32
        shot "" control-399 1280 720 -lamps 399 -spots 32
        if same control-400 control-399; then
          echo "control: dropping a lamp changed nothing -- this gate proves nothing"
          status=1
        else
          echo "control: one lamp fewer changes the capture, as it must"
        fi
        # A failure here is a picture, so keep the pictures: the clustered and
        # brute-force captures of the pose that failed are what say whether the
        # difference is tile-shaped, and re-running to get them back means
        # guessing which pose it was.
        if [ $status -ne 0 ]; then
          echo "captures kept in examples/$d"
        else
          rm -rf $d
        fi
        exit $status

  waterblend:
    desc: "Check that a blended effect in front of the water is not painted over by it"
    dir: examples
    cmds:
      # Needs a GPU, so it sits with smoke, validate and determinism rather
      # than in `task ci`.
      #
      # Water is drawn last, in a second pass, because refraction samples the
      # finished frame. Nothing blended writes depth, so where a flame stood in
      # front of the lake the depth buffer held the lake BED, the water passed
      # the depth test, and the flame was painted over: cut off dead flat at
      # the waterline, fine against sky and gone against water. Issue #45.
      #
      # Nothing else saw it and nothing else could. `task smoke` renders the
      # frame, `task validate` is silent, `task determinism` is happy because
      # the wrong image is wrong the same way every time -- and no example had
      # water and a blended effect in the same scene at all until 09-water grew
      # these flags.
      #
      # The pair is the whole trick, the same way it is in `task hud`. A single
      # frame cannot say what should have been there, so the plume is toggled
      # and the difference is the light it ADDED: a bright lake cannot fake
      # that, because the same lake is under both captures and subtracts out.
      # The -ref box over sky is the same plume in the same pair, and it makes
      # the reading self-calibrating -- "as present below the waterline as
      # above it" is a claim no fixed threshold can carry.
      #
      # PROVED: with blendSplit.active forced to false -- every blended draw
      # back before the refraction copy, which is the order that shipped -- the
      # box over water reads +4.2 mean luma against +76.9 with the fix, a ratio
      # of 0.115 against 2.096. Both floors bite. Restored immediately after.
      #
      # The remaining +4.2 is why there is a ratio floor and not just "greater
      # than zero": the swallowed plume is still in the refraction copy, so the
      # water shows an absorbed, smeared ghost of it rather than nothing.
      #
      # The control box over sky reads +36.7 either way, to the tenth. That
      # half of the plume was never the broken half, and a run where it moves
      # is a run where the camera or the emitter changed, so nothing measured
      # below the waterline in it would mean anything -- which is what -minref
      # is for.
      - |
        status=0
        d=.waterblend
        rm -rf $d && mkdir -p $d
        shot() { GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./09-water -frames 150 "$@" >/dev/null 2>&1; }
        shot -plume -ghost -marker -submerged -screenshot $d/plume.png
        shot -ghost -marker -submerged -screenshot $d/bare.png
        if [ ! -s $d/plume.png ] || [ ! -s $d/bare.png ]; then
          echo "MISSING CAPTURE -- this gate proves nothing"
          exit 1
        fi
        go run ../cmd/blendcheck -a $d/plume.png -b $d/bare.png \
          -box 300,420,90,200 -ref 300,250,90,130 -min 25 -minref 20 -ratio 0.8 || status=1
        # A failure here is a picture: whether the plume stops at the waterline
        # or is merely dimmer is the difference between this bug and a lighting
        # change, and re-running to get the captures back wastes the evidence.
        if [ $status -ne 0 ]; then
          echo "captures kept in examples/$d"
        else
          rm -rf $d
        fi
        exit $status

  nightlight:
    desc: "Check that lamplight still reads as lamplight after the night shift"
    dir: examples
    cmds:
      # Needs a GPU, so it sits with smoke, validate, determinism and lights
      # rather than in `task ci`.
      #
      # atmNightShift blends night-time surfaces toward a blue-weighted grey,
      # and it used to do that on sun altitude alone. At full night that blend
      # is one-sided -- the shifted blue channel lands above the shifted green
      # for every colour with no negative channel -- so a warm lamp could not
      # put a warm pool on the ground no matter what colour or intensity it
      # was given. Nothing else here notices: `task smoke` renders the frame,
      # `task validate` says the layer is happy and `task determinism` says
      # two runs agree, and all three were green for as long as it lasted.
      #
      # The capture is the doorway close-up rather than the overview, because
      # the pool has to be a large enough patch of one surface to average.
      # See cmd/lampcheck for the boxes and for the ablation that shows this
      # fails when the weighting is removed.
      #
      # -span 60 is there because the ordering test alone only catches the
      # weighting being gone, not being weak: a doorway pool is lamp-dominated
      # enough that 85% of the weighting can be thrown away and the hue still
      # comes out red above green above blue. Measured red-minus-blue across
      # the pool box at local-term weights 1.00 / 0.35 / 0.15 / 0.00: 72.5 /
      # 63.1 / 48.8 / -23.3. The floor sits between the first and the third.
      - |
        status=0
        d=.nightlight
        rm -rf $d && mkdir -p $d
        GLYPHENGINE_FIXED_FRAME_TIME=16.667ms go run ./21-streetlights -frames 90 \
          -width 1280 -height 720 \
          -camtargetx 22 -camtargety 1.5 -camtargetz 0 \
          -camyaw -1.5708 -campitch 0.25 -camdist 9 -camlook 0.6 \
          -screenshot $d/doorway.png >/dev/null 2>&1
        if [ ! -s $d/doorway.png ]; then
          echo "MISSING CAPTURE -- this gate proves nothing"
          exit 1
        fi
        go run ../cmd/lampcheck -i $d/doorway.png -pool 560,650,160,60 -unlit 110,640,110,60 -span 60 || status=1
        # A failure here is a picture. Keep it, the way `task lights` does.
        if [ $status -ne 0 ]; then
          echo "capture kept in examples/$d"
        else
          rm -rf $d
        fi
        exit $status

  bench:
    desc: Run the benchmark scenes and print CPU/GPU cost per pass
    cmds:
      # Needs a GPU. Timings come from GPU timestamp queries and the engine's own
      # per-phase CPU timer, so this does not need vsync off -- which is the
      # point, since the old way of benchmarking pegged the card audibly.
      #
      # No committed baseline to compare against: frame cost depends on the GPU,
      # the driver, the display mode and what else is running, so a stored number
      # would be from someone else's machine. Run it before and after a change.
      - go run ./cmd/bench {{.CLI_ARGS}}

  ci:
    desc: Run everything CI runs
    cmds:
      - task: lint
      - task: build
      - task: test
      - task: test:race

  clean:
    desc: Remove build output
    cmds:
      - rm -rf dist .task
