name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Windows is the supported platform, so it is the one that gates.
  #
  # Note this builds and tests but does not render: GitHub runners have no GPU,
  # so `task smoke` and `task validate` stay local until a lavapipe job exists
  # (blocked on Linux, see below).
  windows:
    name: build + test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Every package that imports the renderer links against the Vulkan
      # loader (`#cgo LDFLAGS: -lvulkan`), so even `go test` needs it present.
      # Only the headers and loader are built, not the whole SDK.
      - name: Install Vulkan loader
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.3.268.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      # MinGW's linker resolves `-lvulkan` to libvulkan.a, but the Vulkan SDK
      # ships the loader as vulkan-1.lib. Nothing bridges the two, which is why
      # a fresh Windows checkout fails to link with "cannot find -lvulkan" —
      # the single most common first-run failure on this platform.
      #
      # Both are COFF import libraries, so aliasing the name is enough.
      - name: Configure Vulkan link flags
        shell: bash
        run: |
          echo "VULKAN_SDK=$VULKAN_SDK"
          find "$VULKAN_SDK" \( -name '*.lib' -o -name '*.a' -o -name '*vulkan*.dll' \) -print | head -20

          lib=$(find "$VULKAN_SDK" \( -iname 'libvulkan.a' -o -iname 'libvulkan.dll.a' -o -iname 'vulkan-1.lib' \) -print -quit)
          if [ -z "$lib" ]; then
            echo "::error::no Vulkan loader import library found under VULKAN_SDK"
            exit 1
          fi
          echo "using loader library: $lib"

          mkdir -p "$RUNNER_TEMP/vklib"
          cp "$lib" "$RUNNER_TEMP/vklib/libvulkan.a"
          echo "CGO_LDFLAGS=-L$(cygpath -m "$RUNNER_TEMP/vklib")" >> "$GITHUB_ENV"

      - name: Install go-task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Lint
        run: task lint

      - name: Build
        run: task build

      - name: Test
        run: task test

      # The parallel movement phase is only correct because of a collision
      # snapshot and store locking; without the detector a regression there is
      # invisible until it corrupts a player's position in production.
      - name: Test (race)
        run: task test:race

  # Linux is a supported consumer platform, so it gates. It gets the same
  # lint/build/test/race treatment as Windows and needs none of the MinGW
  # loader aliasing above: libvulkan-dev installs a real libvulkan.so where
  # the linker already looks.
  #
  # This job was advisory until 2026-08-22. vkngwrapper/core v3.1.1 omits an
  # `unsafe` import in system_nonwindows.go, so nothing off Windows compiled at
  # all. The fix is merged upstream but still untagged, so go.mod pins the
  # merge commit as a pseudo-version -- see the note there before "fixing" it.
  linux:
    name: build + test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libgl1-mesa-dev xorg-dev

      - name: Install go-task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Lint
        run: task lint

      - name: Build
        run: task build

      - name: Test
        run: task test

      - name: Test (race)
        run: task test:race

  # What a `go get` user actually receives, which is not what a local build
  # sees. The engine embeds 37 .spv files with go:embed and export-ignores
  # docs/images, so the module is only usable if every embedded file is
  # committed AND survives the archive. Both are invisible to an in-repo build,
  # which reads the working tree including anything uncommitted or ignored.
  #
  # cmd/go builds module zips with `git archive`, so archiving HEAD reproduces
  # the consumer's tree exactly -- offline and without needing the commit to be
  # fetchable by the module proxy.
  #
  # Verified by breaking it: deleting shaders/clouds.frag.spv from the archive
  # fails this job with "pattern clouds.frag.spv: no matching files found"
  # while task ci stays green, which is the whole point.
  consumer:
    name: go get consumer (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libgl1-mesa-dev xorg-dev

      - name: Build against the module as published
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/engine" "$RUNNER_TEMP/consumer"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/engine"

          # go.work in the checkout must not leak into the consumer build.
          export GOWORK=off
          cd "$RUNNER_TEMP/consumer"

          go mod init consumer
          go mod edit -require=github.com/derekmwright/glyphengine@v0.0.0
          go mod edit -replace=github.com/derekmwright/glyphengine="$RUNNER_TEMP/engine"

          cat > main.go <<'EOF'
          // Imports the engine the way a downstream game would: the root
          // package, which transitively pulls in the renderer and therefore
          // every embedded shader.
          package main

          import "github.com/derekmwright/glyphengine"

          func main() { _ = glyphengine.DefaultTickRate }
          EOF

          go mod tidy
          go build ./...
